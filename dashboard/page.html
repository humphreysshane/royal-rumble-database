          });
          list.style.display = "none";
          card.appendChild(toggle);
          card.appendChild(list);
        }
        ctGrid.appendChild(card);
      });
    }
    ctSearch.addEventListener("input", drawCommentators);
    roleSelect.addEventListener("change", drawCommentators);
    drawCommentators();

    // --- Match type frequency --------------------------------------------
    c.appendChild(el("div", {class:"cat-heading", style:"margin-top:26px;", text:"Most Frequent Match Types on the Card ("+fc.matchTypeFrequency.length+")"}));
    var mtScroll = el("div", {class:"table-scroll"});
    var mtTable = el("table", {class:"hist-table"});
    mtTable.appendChild(el("thead", {}, [el("tr", {}, [el("th", {text:"Match type"}), el("th", {text:"Occurrences"}), el("th", {text:"Events"})])]));
    var mtBody = el("tbody");
    fc.matchTypeFrequency.slice().sort(function(a,b){ return b.occurrences - a.occurrences || a.matchType.localeCompare(b.matchType); }).forEach(function(r){
      mtBody.appendChild(el("tr", {}, [
        el("td", {text: r.matchType || "—"}),
        el("td", {class:"num", text: String(r.occurrences)}),
        el("td", {class:"num", text: String(r.eventsCount)})
      ]));
    });
    mtTable.appendChild(mtBody);
    mtScroll.appendChild(mtTable);
    c.appendChild(mtScroll);

    // --- Title frequency ---------------------------------------------------
    c.appendChild(el("div", {class:"cat-heading", style:"margin-top:26px;", text:"Titles Featured on the Card ("+fc.titleFrequency.length+")"}));
    var tfScroll = el("div", {class:"table-scroll"});
    var tfTable = el("table", {class:"hist-table"});
    tfTable.appendChild(el("thead", {}, [el("tr", {}, [el("th", {text:"Title"}), el("th", {text:"Times defended/contested"}), el("th", {text:"Events"}), el("th", {text:"Distinct champions"})])]));
    var tfBody = el("tbody");
    fc.titleFrequency.slice().sort(function(a,b){ return b.occurrences - a.occurrences || a.title.localeCompare(b.title); }).forEach(function(r){
      tfBody.appendChild(el("tr", {}, [
        el("td", {text: r.title || "—"}),
        el("td", {class:"num", text: String(r.occurrences)}),
        el("td", {class:"num", text: String(r.eventsCount)}),
        el("td", {class:"num", text: String(r.distinctChampionsCount)})
      ]));
    });
    tfTable.appendChild(tfBody);
    tfScroll.appendChild(tfTable);
    c.appendChild(tfScroll);

    return c;
  }

  // ---------------- page: commentators by Rumble division ----------------
  function pageCommentators(div){
    var c = el("div", {class:"container"});
    var validEvents = {};
    (div.events||[]).forEach(function(ev){ validEvents[ev.id]=ev; });
    var rows = ((DB.fullCard||{}).commentators||[]).filter(function(r){
      return r.role==="Commentator" || r.role==="Guest commentator" || r.role==="Ring Announcer" || r.role==="Ring announcer";
    }).map(function(r){
      var appearances=(r.events||[]).filter(function(ev){return !!validEvents[ev.id];});
      return {personId:r.personId,personName:r.personName,role:r.role,events:appearances};
    }).filter(function(r){return r.events.length;});
    c.appendChild(el("div", {class:"page-head"}, [
      el("div", {class:"eyebrow", text:div.label+" · Broadcast history"}),
      el("h2", {text:"Commentators & Broadcast Team"}),
      el("p", {text:"Commentators, guest commentators and ring announcers credited on researched "+div.label+" event cards. Select a person to see every covered event."})
    ]));
    var grid=el("div",{class:"grid records"});
    rows.sort(function(a,b){return b.events.length-a.events.length||a.personName.localeCompare(b.personName);}).forEach(function(r){
      var card=el("div",{class:"card rec-card actionable"});
      card.appendChild(el("div",{class:"cat",text:r.role}));
      card.appendChild(el("div",{class:"nm"},[anyDivWlink(r.personId,r.personName)]));
      card.appendChild(el("div",{class:"val",text:r.events.length+" event"+(r.events.length!==1?"s":"")}));
      var list=el("div",{class:"member-list"});
      r.events.forEach(function(e){
        list.appendChild(el("div",{class:"member-row"},[
          el("span",{class:"wlink",text:String(e.year||e.id),onclick:function(ev){ev.stopPropagation();navigate("/"+div.key+"/events/"+e.id);}}),
          el("span",{class:"d",text:e.name||""})
        ]));
      });
      card.addEventListener("click",function(){list.style.display=list.style.display==="block"?"none":"block";});
      card.appendChild(el("div",{class:"note member-toggle",text:"Click for event list"}));
      card.appendChild(list); grid.appendChild(card);
    });
    if(!rows.length) grid.appendChild(el("div",{class:"sub",text:"No broadcast-team research is available for this division yet."}));
    c.appendChild(grid); return c;
  }

  // ---------------- page: events list ----------------
  function pageEvents(div){
    var c = el("div", {class:"container"});
    c.appendChild(el("div", {class:"page-head"}, [
      el("div", {class:"eyebrow", text:div.label}),
      el("h2", {text:"Events"}),
      el("p", {text:"Every "+div.label+" match built into the database so far. Click a year for the full entrant list, elimination order and timing."})
    ]));
    var searchWrap = el("div", {style:"margin-bottom:16px;"});
    var search = el("input", {class:"search", type:"text", placeholder:"Filter by year, venue or winner…"});
    searchWrap.appendChild(search);
    c.appendChild(searchWrap);

    var fc=(DB&&DB.fullCard)||{matchTypeFrequency:[],titleFrequency:[]};
    var leaders=el("div",{class:"grid records",style:"margin-bottom:22px;"});
    function frequencyPanel(title,subtitle,rows,labelFn){
      var panel=el("div",{class:"panel"});
      panel.appendChild(el("h3",{text:title}));
      panel.appendChild(el("div",{class:"sub",text:subtitle}));
      var max=rows.length?rows[0].occurrences:1;
      rows.slice(0,10).forEach(function(r){panel.appendChild(barRow(labelFn(r),r.occurrences,max,false,function(v){return v+" card"+(v!==1?"s":"");}));});
      if(!rows.length)panel.appendChild(el("div",{class:"method-note",text:"No researched card data available yet."}));
      return panel;
    }
    var matchLeaders=(fc.matchTypeFrequency||[]).slice().sort(function(a,b){return b.occurrences-a.occurrences||a.matchType.localeCompare(b.matchType);});
    var titleLeaders=(fc.titleFrequency||[]).slice().sort(function(a,b){return b.occurrences-a.occurrences||a.title.localeCompare(b.title);});
    leaders.appendChild(frequencyPanel("Most frequent match types","Across the researched Royal Rumble event cards; shared by the Men's and Women's event views.",matchLeaders,function(r){return r.matchType;}));
    leaders.appendChild(frequencyPanel("Most frequently contested titles","Championship matches elsewhere on researched Royal Rumble cards.",titleLeaders,function(r){return r.title;}));
    c.appendChild(leaders);

    var grid = el("div", {class:"grid events"});
    c.appendChild(grid);

    function draw(filter){
      grid.innerHTML = "";
      var f = (filter||"").toLowerCase();
      div.events.forEach(function(ev){
        var winnerNames = (ev.winners && ev.winners.length ? ev.winners.map(function(w){return w.name;}).join(" & ") : "");
        var hay = (ev.year+" "+(ev.venue||"")+" "+(ev.city||"")+" "+winnerNames).toLowerCase();
        if (f && hay.indexOf(f) === -1) return;
        grid.appendChild(el("div", {class:"card ev-card", onclick:(function(id){return function(){navigate("/"+div.key+"/events/"+id);};})(ev.id)}, [
          el("div", {class:"yr", text:ev.year}),
          el("div", {class:"nm", text:(ev.venue||"")+(ev.city?(", "+ev.city):"")}),
          el("div", {class:"wn"}, [document.createTextNode((ev.winners && ev.winners.length>1?"Winners: ":"Winner: ")), el("b",{text: winnerNames || "—"})])
        ]));
      });
      if (!grid.children.length) grid.appendChild(el("div",{class:"sub", text:"No events match “"+filter+"”."}));
    }
    draw("");
    search.addEventListener("input", function(){ draw(search.value); });
    return c;
  }

  // ---------------- page: event detail ----------------
  function pageEventDetail(div, id){
    var ev = byId[id];
    var c = el("div", {class:"container"});
    if (!ev){
      c.appendChild(el("div",{class:"backlink", text:"← Back to Events", onclick:function(){navigate("/"+div.key+"/events");}}));
      c.appendChild(el("p", {text:"Event not found."}));
      return c;
    }
    c.appendChild(el("div",{class:"backlink", text:"← Back to Events", onclick:function(){navigate("/"+div.key+"/events");}}));

    var hero = el("div", {class:"ev-hero"});
    var heroYr = el("div", {class:"yr"}, [document.createTextNode(ev.year+" ")]);
    if (ev.winners && ev.winners.length){
      var wbadge = el("span",{class:"badge-winner"});
      wbadge.appendChild(document.createTextNode((ev.winners.length>1?"WINNERS: ":"WINNER: ")));
      ev.winners.forEach(function(w, wi){
        if (wi) wbadge.appendChild(document.createTextNode(" & "));
        wbadge.appendChild(wlink(w.id, (w.name||"").toUpperCase()));
      });
      heroYr.appendChild(wbadge);
    }
    hero.appendChild(heroYr);
    hero.appendChild(el("div", {class:"mn", text:ev.matchName || ev.name}));
    var facts = el("div", {class:"factrow"});
    function fact(l,v){ if (v===null||v===undefined||v==="") return; facts.appendChild(el("div",{class:"fact"},[el("div",{class:"l",text:l}), el("div",{class:"v",text:v})])); }
    function factNode(l, node){ if (!node) return; facts.appendChild(el("div",{class:"fact"},[el("div",{class:"l",text:l}), el("div",{class:"v"},[node])])); }
    fact("Date", ev.date);
    fact("Venue", ev.venue);
    fact("Location", (ev.city||"")+(ev.country?(", "+ev.country):""));
    fact("Attendance", ev.attendance ? fmtNum(ev.attendance) : null);
    fact("Duration", ev.duration);
    fact("Entrants", ev.entrantCount);
    fact("Eliminations", ev.elimsCount);
    fact("Champions in field", ev.championsInField);
    fact("Returning wrestlers", ev.returningCount);
    if (ev.dualDutyEntrants && ev.dualDutyEntrants.length){
      var dualWrap=el("span",{});
      ev.dualDutyEntrants.forEach(function(w,idx){if(idx)dualWrap.appendChild(document.createTextNode(" · "));dualWrap.appendChild(wlink(w));});
      factNode("Wrestled earlier that night",dualWrap);
    }
    if (ev.eventStaff && ev.eventStaff.length){
      ["Commentator","Guest commentator","Ring Announcer"].forEach(function(role){
        var people=ev.eventStaff.filter(function(p){return p.role===role;});
        if(!people.length)return;
        var staffWrap=el("span",{});
        people.forEach(function(p,idx){if(idx)staffWrap.appendChild(document.createTextNode(" · "));staffWrap.appendChild(anyDivWlink(p.id,p.name));});
        factNode(role==="Ring Announcer"?"Ring announcer":role+"s",staffWrap);
      });
    }
    if (ev.fieldPhysical && ev.fieldPhysical.combinedWeightKg!==null) fact("Combined billed field weight", fmtDec(ev.fieldPhysical.combinedWeightKg,1)+" kg");
    if (ev.fieldPhysical && ev.fieldPhysical.averageWeightKg!==null) fact("Average billed weight", fmtDec(ev.fieldPhysical.averageWeightKg,1)+" kg");
    if (ev.fieldPhysical && ev.fieldPhysical.combinedHeightM!==null) fact("Combined billed field height", fmtDec(ev.fieldPhysical.combinedHeightM,2)+" m");
    if (ev.fieldPhysical && ev.fieldPhysical.averageHeightM!==null) fact("Average billed height", fmtDec(ev.fieldPhysical.averageHeightM,3)+" m");
    if (ev.runnerUp) factNode("Runner-up", wlink(ev.runnerUp.id, ev.runnerUp.name));
    if (ev.occupancy) fact("Peak in ring", ev.occupancy.peakCount+" wrestlers, "+ev.occupancy.startTime+"-"+ev.occupancy.endTime);
    if (ev.entranceStats && ev.entranceStats.median) fact("Median entrance", ev.entranceStats.median);
    hero.appendChild(facts);
    if (ev.significance) hero.appendChild(el("div",{class:"sig", text:ev.significance}));
    c.appendChild(hero);

    if (ev.cardMatches && ev.cardMatches.length){
      var cardPanel=el("div",{class:"panel",style:"margin-bottom:20px;"});
      cardPanel.appendChild(el("h3",{text:"Full event card"}));
      cardPanel.appendChild(el("div",{class:"sub",text:"The Rumble and every separately researched match from the show are presented with the event. Numbered matches retain the card order recorded in the source data."}));
      cardPanel.appendChild(el("div",{class:"card-match"},[
        el("div",{class:"match-no",text:"RUMBLE"}),
        el("div",{},[el("b",{text:ev.matchName||ev.name})]),
        el("div",{text:"Full entrant and elimination detail below"}),
        el("div",{class:"num",text:ev.duration||"—"})
      ]));
      ev.cardMatches.forEach(function(m){
        var people=el("div",{});
        m.participants.forEach(function(p,idx){
          if(idx)people.appendChild(document.createTextNode(" · "));
          people.appendChild(anyDivWlink(p.id,p.name||p.id));
          if(p.result)people.appendChild(el("span",{class:"method-note",style:"display:inline; margin-left:4px;",text:"("+p.result+")"}));
          if(p.wonTitle)people.appendChild(el("span",{class:"chip",style:"margin-left:5px; background:var(--accent-wash); color:var(--accent-ink);",text:"Won title"}));
          if(p.lostTitle)people.appendChild(el("span",{class:"chip",style:"margin-left:5px;",text:"Lost title"}));
          if(p.wasChampionEntering&&!p.lostTitle)people.appendChild(el("span",{class:"chip",style:"margin-left:5px;",text:"Entered as champion"}));
        });
        var matchLabel=el("div",{class:"match-no",text:m.number!==null&&m.number!==undefined?"#"+m.number:""});
        if(m.isPreShow)matchLabel.appendChild(el("span",{class:"chip",style:"display:block; margin-top:5px;",text:"PRE-SHOW"}));
        cardPanel.appendChild(el("div",{class:"card-match"},[
          matchLabel,
          el("div",{},[el("b",{text:m.type||"Match"}),m.championship?el("div",{class:"method-note",text:m.championship}):null]),
          people,
          el("div",{class:"num",text:m.duration||m.position||"—"})
        ]));
      });
      c.appendChild(cardPanel);
    }

    var cols = el("div", {class:"ev-cols"});

    // ring-time chart
    var chartPanel = el("div", {class:"panel"});
    chartPanel.appendChild(el("h3", {text:"Time in the ring"}));
    chartPanel.appendChild(el("div", {class:"sub", text:"Every entrant, longest to shortest"}));
    var withTime = ev.entrants.filter(function(e){return e.ringSec!==null && e.ringSec!==undefined;});
    withTime.sort(function(a,b){return (b.ringSec||0)-(a.ringSec||0);});
    var maxRing = withTime.length ? withTime[0].ringSec : 1;
    withTime.forEach(function(e){
      chartPanel.appendChild(barRow(e.name, e.ringSec, maxRing, e.isWinner, fmtSec, e.id));
    });
    cols.appendChild(chartPanel);

    // elimination timeline
    var tPanel = el("div", {class:"panel"});
    tPanel.appendChild(el("h3", {text:"Elimination order"}));
    tPanel.appendChild(el("div", {class:"sub", text:"In the order each entrant left the match"}));
    var scroller = el("div", {class:"table-scroll"});
    var table = el("table", {class:"elim-table"});
    table.appendChild(el("thead",{},[el("tr",{},[
      el("th",{text:"#"}), el("th",{text:"Entry"}), el("th",{text:"Wrestler"}),
      el("th",{text:"Eliminated by"}), el("th",{text:"Time"}), el("th",{text:"Src"})
    ])]));
    var tbody = el("tbody");
    var ordered = ev.entrants.slice().sort(function(a,b){
      var an = a.isWinner ? Infinity : (a.elimNum===null?Infinity-1:a.elimNum);
      var bn = b.isWinner ? Infinity : (b.elimNum===null?Infinity-1:b.elimNum);
      return an-bn;
    });
    ordered.forEach(function(e){
      var nameCell = el("td", {class:"name-cell"});
      var nameB = el("b",{});
      nameB.appendChild(wlink(e.id, e.name));
      nameCell.appendChild(el("div",{},[nameB, e.isWinner?el("span",{class:"chip", style:"background:var(--accent-wash); color:var(--accent-ink);", text:"Winner"}):null, e.isRunnerUp?el("span",{class:"chip", text:"Runner-up"}):null, e.isSelf?el("span",{class:"chip", text:"Self-elim"}):null]));
      if (e.badges && e.badges.length){
        var bwrap = el("div",{class:"badges"});
        e.badges.filter(function(b){return b!=="Wrestled earlier on card";}).forEach(function(b){bwrap.appendChild(el("span",{class:"chip", text:b}));});
        nameCell.appendChild(bwrap);
      }
      var pp = e.physicalProfile || {};
      var physicalParts = [];
      if (pp.heightM) physicalParts.push(pp.heightM+" m");
      if (pp.weightKg) physicalParts.push(pp.weightKg+" kg");
      if (pp.billedFrom) physicalParts.push("from "+pp.billedFrom);
      if (physicalParts.length) nameCell.appendChild(el("div",{class:"method-note",text:physicalParts.join(" · ")}));
      var cp = e.characterProfile || {};
      var characterParts = [];
      if (cp.alignment) characterParts.push(cp.alignment);
      if (cp.gimmick) characterParts.push(cp.gimmick);
      if (cp.manager) characterParts.push("managed by "+cp.manager);
      if (cp.tagTeam) characterParts.push(cp.tagTeam);
      if (cp.faction && cp.faction !== cp.tagTeam) characterParts.push(cp.faction);
      if (characterParts.length) nameCell.appendChild(el("div",{class:"method-note",text:characterParts.join(" · ")}));
      var byCell = el("td", {class:"by-list"});
      if (e.neverEntered){
        byCell.appendChild(document.createTextNode("Drew a number but never entered"));
      } else if (e.by && e.by.length){
        e.by.forEach(function(b, bi){
          if (bi > 0) byCell.appendChild(document.createTextNode(" & "));
          byCell.appendChild(wlink(b));
        });
        if (e.method) byCell.appendChild(el("div",{class:"method-note", text:e.method}));
      } else if (e.isWinner){
        byCell.appendChild(document.createTextNode("—"));
      } else {
        byCell.appendChild(document.createTextNode("Unrecorded"));
      }
      var qCell = el("td");
      if (e.neverEntered){
        qCell.appendChild(el("span",{class:"quality-pill unknown", text:"Non-entry"}));
      } else if (!e.isWinner){

        qCell.appendChild(el("span",{class:"quality-pill "+cls, text:qualityLabel(e.quality,e.disputed)}));
      }
      tbody.appendChild(el("tr",{},[
        el("td",{class:"num", text: e.isWinner ? "—" : (e.neverEntered ? "—" : (e.elimNum!==null?e.elimNum:"?"))}),
        el("td",{class:"num", text: e.entry!==null?e.entry:"—"}),
        nameCell,
        byCell,
        el("td",{class:"num", text: e.neverEntered ? "—" : (e.elimTime || (e.isWinner?ev.duration:"—") || "—")}),

      var occNames = el("div", {class:"badges", style:"margin-top:10px;"});
      ev.occupancy.wrestlers.forEach(function(w){ var chip=el("span",{class:"chip"}); chip.appendChild(wlink(w)); occNames.appendChild(chip); });
      occPanel.appendChild(occNames);
      c.appendChild(occPanel);
    }

    if (ev.crowdedness && ev.crowdedness.length){
      var crowdPanel = el("div", {class:"panel section-gap"});
      crowdPanel.appendChild(el("h3", {text:"Ring crowdedness"}));
      crowdPanel.appendChild(el("div", {class:"sub", text:"Percentage of this match's measured time spent with each number of wrestlers simultaneously in the ring. Same reconstructed timeline as peak ring occupancy above, broken out by every count rather than just the peak."}));
      var crowdWrap = el("div", {style:"margin-top:10px;"});
      var maxPct = Math.max.apply(null, ev.crowdedness.map(function(r){ return r.pct||0; }));
      ev.crowdedness.slice().reverse().forEach(function(r){
        crowdWrap.appendChild(barRow(r.count+(r.count===1?" wrestler":" wrestlers"), r.pct||0, maxPct, false, function(v){ return v.toFixed(1)+"% ("+r.time+")"; }));
      });
      crowdPanel.appendChild(crowdWrap);
      c.appendChild(crowdPanel);
    }

    if (ev.nationalityBreakdown && ev.nationalityBreakdown.length){
      var natPanel = el("div", {class:"panel section-gap"});
      natPanel.appendChild(el("h3", {text:"Billed nationality"}));
      var natCoverage = ev.nationalityCoveragePct;
      var natCoverageText = "Billed nationality is recorded for "+(natCoverage!==null&&natCoverage!==undefined?fmtDec(natCoverage,1)+"%":"an unknown share")+" of this match's actual entrants. Percentages below are of entrants with a known nationality, not the full field — treat sparse-coverage events with caution.";
      natPanel.appendChild(el("div", {class:"sub", text:natCoverageText}));
      var natWrap = el("div", {style:"margin-top:10px;"});
      var maxNatCount = Math.max.apply(null, ev.nationalityBreakdown.map(function(r){ return r.count||0; }));
      ev.nationalityBreakdown.forEach(function(r){
        natWrap.appendChild(barRow(r.nationality, r.count, maxNatCount, false, function(v){ return v+" ("+r.pctOfKnown.toFixed(1)+"%)"; }));
      });
      natPanel.appendChild(natWrap);
      c.appendChild(natPanel);
    }

    if (ev.physicalPeaks){
      var pp = ev.physicalPeaks;
      var physicalPeakPanel = el("div", {class:"panel section-gap"});
      physicalPeakPanel.appendChild(el("h3", {text:"Maximum combined size in the ring"}));
      physicalPeakPanel.appendChild(el("div", {class:"sub", text:"Derived only where the full match timeline and every entrant's appearance-specific physical profile are complete. Missing height or weight is never estimated."}));
      var physicalPeakFacts = el("div", {class:"factrow", style:"margin-top:12px;"});
      function physicalPeakFact(label, row, digits){
        if (!row) return;
        physicalPeakFacts.appendChild(el("div", {class:"fact"}, [
          el("div", {class:"l", text:label}),
          el("div", {class:"v", text:fmtDec(row.value,digits)+" "+row.unit+" · "+row.startTime+"-"+row.endTime})
        ]));
      }
      physicalPeakFact("Combined billed weight", pp.combined_billed_weight, 1);
      physicalPeakFact("Combined billed height", pp.combined_billed_height, 2);
      physicalPeakPanel.appendChild(physicalPeakFacts);
      [pp.combined_billed_weight, pp.combined_billed_height].forEach(function(row){
        if (!row) return;
        var names = el("div", {class:"badges", style:"margin-top:10px;"});
        row.wrestlers.forEach(function(w){ var chip=el("span",{class:"chip"}); chip.appendChild(wlink(w)); names.appendChild(chip); });
        physicalPeakPanel.appendChild(names);
      });
      c.appendChild(physicalPeakPanel);
    }

    if (ev.entranceStats){
      var es = ev.entranceStats;
      var entrancePanel = el("div", {class:"panel section-gap"});
      entrancePanel.appendChild(el("h3", {text:"Entrance timing"}));

      var entranceFacts = el("div", {class:"factrow", style:"margin-top:12px;"});
      function entranceFact(label, value){
        if (value===null || value===undefined || value==="") return;

          el("div",{class:"l",text:label}), el("div",{class:"v",text:value})

      if (es.latestPhysicalWrestler){

      }

      var entranceRows = ev.entrants.filter(function(e){ return e.entranceDurationSec!==null && e.entranceDurationSec!==undefined; });

    if (ev.notableMoments && ev.notableMoments.length){

      ev.notableMoments.forEach(function(m){

  // ---------------- page: records & leaderboards ----------------
  var STATS_COLS = [
    {k:"name", l:"Wrestler", type:"str"},
    {k:"appearances", l:"App", type:"num"},
    {k:"wins", l:"Wins", type:"num"},
    {k:"runnerUp", l:"R-Up", type:"num"},
    {k:"finalFour", l:"Final 4", type:"num"},
    {k:"elims", l:"Career Elims", type:"num"},
    {k:"avgElims", l:"Avg/App", type:"num1"},

  var statsSort = {col:"elims", dir:-1};

  function pageRecords(div){
    var c = el("div", {class:"container"});

      el("div", {class:"eyebrow", text:div.label+" · All-time"}),
      el("h2", {text:"Records & Leaderboards"}),

    ]));

    var byCat = {};
    div.records.forEach(function(r){ (byCat[r.category]=byCat[r.category]||[]).push(r); });
    Object.keys(byCat).sort().forEach(function(cat){
      c.appendChild(el("div", {class:"cat-heading", text:cat}));
      var grid = el("div", {class:"grid records"});
      byCat[cat].forEach(function(r){
        var card = el("div", {class:"card rec-card actionable"});
        card.appendChild(el("div",{class:"nm", text:r.name}));
        card.appendChild(el("div",{class:"val", text:r.value}));
        if (r.holder.name){
          var holderDiv = el("div",{class:"holder"});
          // holder.id can be a "a -> b" rivalry pairing rather than a single
          // wrestler_id -- only linkify when it's a real profile id in THIS division.
          if (r.holder.id && div._byWid[r.holder.id]) holderDiv.appendChild(wlink(r.holder.id, r.holder.name));
          else holderDiv.appendChild(document.createTextNode(r.holder.name));
          if (r.eventId) holderDiv.appendChild(document.createTextNode(" · "+r.eventId.replace("RR","").replace(/[MWG]$/,"")));
          card.appendChild(holderDiv);
        } else if (r.eventId){
          card.appendChild(el("div",{class:"holder", text:r.eventId}));
        }
        if (r.notes) card.appendChild(el("div",{class:"note", text:r.notes}));
        // `members` is the record's own structured full-list data when the
        // build already provides one (e.g. every HOFer in a single field).
        // Failing that, a "Tied with: ..." clause inside `notes` is parsed
        // into the same shape so ties get the identical expand-on-click
        // treatment rather than sitting as static text -- see
        // parseTiedFromNotes above.
        var members = r.members;
        var tiedFromNotes = false;
        if (!members || !members.length){
          var tied = parseTiedFromNotes(r.notes, div);
          if (tied && tied.length){
            members = tied;
            tiedFromNotes = true;
          }
        }
        if (members && members.length){
          var open = false;
          var list = el("div", {class:"member-list"});
          members.forEach(function(m){
            var nameNode = m.isEvent
              ? el("span", {class:"wlink", text:m.name, onclick:(function(eid){return function(ev){ ev.stopPropagation(); navigate("/"+div.key+"/events/"+eid); };})(m.id)})
              : wlink(m.id, m.name);
            list.appendChild(el("div", {class:"member-row"}, [
              nameNode,
              el("span", {class:"d", text:m.detail||""})
            ]));
          });
          var shownLabel = tiedFromNotes ? "Show tied holders ("+members.length+") ▾" : "Show all "+members.length+" ▾";
          var hiddenLabel = tiedFromNotes ? "Hide tied holders ▴" : "Hide list ▴";
          var toggle = el("div", {class:"note member-toggle", text:shownLabel});
          toggle.addEventListener("click", function(ev){
            ev.stopPropagation();
            open = !open;
            list.style.display = open ? "block" : "none";
            toggle.textContent = open ? hiddenLabel : shownLabel;
          });
          card.appendChild(toggle);
          card.appendChild(list);
        }
        if (r.holder && r.holder.id && div._byWid[r.holder.id]){
          card.addEventListener("click",(function(wid){return function(){navigate("/"+div.key+"/wrestlers/"+wid);};})(r.holder.id));
        } else if (r.eventId){
          card.addEventListener("click",(function(eid){return function(){navigate("/"+div.key+"/events/"+eid);};})(r.eventId));
        } else if (members && members.length){
          card.addEventListener("click",function(){toggle.click();});
        }
        grid.appendChild(card);
      });
      c.appendChild(grid);
    });
    if (!Object.keys(byCat).length){
      c.appendChild(el("div",{class:"sub", text:"No records tracked yet for the "+div.label+"."}));
    }

    c.appendChild(el("div", {class:"cat-heading section-gap", text:"All-time career stat sheet — "+div.label}));
    var searchWrap = el("div", {style:"margin-bottom:14px;"});
    var search = el("input", {class:"search", type:"text", placeholder:"Search wrestlers…"});
    searchWrap.appendChild(search);
    c.appendChild(searchWrap);

    var tableWrap = el("div", {id:"stats-table-wrap"});
    c.appendChild(tableWrap);

    function drawTable(filter){
      var f = (filter||"").toLowerCase();
      var rows = div.wrestlers.filter(function(w){ return !f || w.name.toLowerCase().indexOf(f) !== -1; });
      rows.sort(function(a,b){
        var col = statsSort.col, dir = statsSort.dir;
        var av = a[col], bv = b[col];
        if (av===null||av===undefined) av = (typeof bv==="number") ? -Infinity : "";
        if (bv===null||bv===undefined) bv = (typeof av==="number") ? -Infinity : "";
        if (typeof av === "string") return dir * av.localeCompare(bv);
        return dir * ((av||0)-(bv||0));
      });
      var table = el("table", {id:"stats-table"});
      var thead = el("thead");
      var htr = el("tr");
      htr.appendChild(el("th", {text:"#"}));
      STATS_COLS.forEach(function(col){
        var isSorted = statsSort.col === col.k;
        var th = el("th", {
          class: isSorted ? "sorted" : "",
          onclick: function(){
            if (statsSort.col === col.k) statsSort.dir *= -1;
            else { statsSort.col = col.k; statsSort.dir = col.type==="str" ? 1 : -1; }
            drawTable(search.value);
          }
        });
        th.appendChild(document.createTextNode(col.l));
        if (isSorted) th.appendChild(el("span",{class:"arrow", text: statsSort.dir===1?"↑":"↓"}));
        htr.appendChild(th);
      });
      thead.appendChild(htr);
      table.appendChild(thead);
      var tbody = el("tbody");
      rows.slice(0, 400).forEach(function(w, idx){

        tr.appendChild(el("td", {class:"rank", text:idx+1}));
        STATS_COLS.forEach(function(col){

            var odb = otherDivisionBadge(w); if (odb) td.appendChild(odb);
            tr.appendChild(td);
            return;
          }
          var text;
          if (col.type==="pct") text = fmtPct(v);
          else if (col.type==="num1") text = (v===null||v===undefined) ? "—" : v.toFixed(1);
          else if (col.type==="num") text = fmtNum(v);
          else text = (v===null||v===undefined||v==="") ? "—" : v;
          tr.appendChild(el("td", {text:text}));
        });
        tbody.appendChild(tr);
      });
      table.appendChild(tbody);
      tableWrap.innerHTML = "";
      tableWrap.appendChild(table);
      if (!rows.length) tableWrap.appendChild(el("div",{class:"sub", text:"No wrestlers match “"+filter+"”."}));
    }
    drawTable("");
    search.addEventListener("input", function(){ drawTable(search.value); });

    c.appendChild(el("div",{class:"footnote", text:"“Best Single” is the most eliminations by that wrestler in one Rumble match. Ties in the records above are shown explicitly rather than hidden behind a single winner. This stat sheet covers "+div.label+" appearances only."}));

    return c;
  }

  // ---------------- page: entry number statistics ----------------

  // ---------------- page: wrestler profile ----------------
  function pageWrestlerDetail(div, id){
    var w = div._byWid[id];
    var c = el("div", {class:"container"});
    if (!w){
      c.appendChild(el("div",{class:"backlink", text:"← Back to Wrestlers", onclick:function(){navigate("/"+div.key+"/wrestlers");}}));
      c.appendChild(el("p", {text:"Wrestler not found in the "+div.label+"."}));
      return c;
    }
    c.appendChild(el("div",{class:"backlink", text:"← Back to Wrestlers", onclick:function(){navigate("/"+div.key+"/wrestlers");}}));

    var bio = w.bio || {};
    var hero = el("div", {class:"wr-hero"});
    var nmRow = el("div", {class:"nm"}, [document.createTextNode(w.name)]);
    if (bio.hallOfFameYear) nmRow.appendChild(el("span",{class:"badge-hof", text:"HOF "+bio.hallOfFameYear}));
    if (bio.deceasedDate) nmRow.appendChild(el("span",{class:"badge-deceased", text:"Deceased"}));
    hero.appendChild(nmRow);
    hero.appendChild(el("div",{class:"aliases", text:div.label+" profile"+(bio.aliases && bio.aliases.length ? "  ·  Also known as: "+bio.aliases.join(", ") : "")}));

    var facts = el("div", {class:"factrow"});
    function factVal(label, factObj, extra){
      if (!factObj || !factObj.value) return;
      var vDiv = el("div",{class:"v"});
      vDiv.appendChild(document.createTextNode(factObj.value + (extra ? " "+extra : "")));
      if (factObj.status && factObj.status.toUpperCase() !== "CONFIRMED"){
        vDiv.appendChild(el("span",{class:"quality-pill "+qualityClass(factObj.status,false), text:qualityLabel(factObj.status,false)}));
      }
      facts.appendChild(el("div",{class:"fact"},[el("div",{class:"l",text:label}), vDiv]));
    }
    function factPlain(label, v){ if (!v) return; facts.appendChild(el("div",{class:"fact"},[el("div",{class:"l",text:label}), el("div",{class:"v",text:v})])); }
    var age = ageAt(bio.dob && bio.dob.value, bio.deceasedDate);
    factVal("Real name", bio.realName);
    factVal("Born", bio.dob, bio.deceasedDate ? null : (age!==null ? "(age "+age+")" : null));
    if (bio.deceasedDate) factPlain("Died", fmtDate(bio.deceasedDate) + (age!==null ? " (age "+age+")" : ""));
    factVal("Birthplace", bio.birthplace);
    factPlain("Nationality", bio.nationality);
    factVal("Ethnicity / heritage", bio.ethnicityHeritage);
    factPlain("WWE debut year", bio.companyDebutYear);
    factPlain("Wrestling style", bio.wrestlingStyle);
    hero.appendChild(facts);
    c.appendChild(hero);

    // Cross-link to this SAME wrestler_id's stat line in the OTHER division
    // (e.g. Beth Phoenix: this is her Men's 2010 page pointing at her
    // Women's 2018 page, or vice versa) -- one identity, two fully
    // independent stat lines, never summed together.
    if (w.otherDivision && w.otherDivision.length){
      var otherPanel = el("div", {class:"also-panel"});
      otherPanel.appendChild(el("div", {class:"also-head", text:"Also competed in"}));
      var olist = el("div", {class:"also-list"});
      w.otherDivision.forEach(function(o, idx){
        if (idx) olist.appendChild(document.createTextNode("  ·  "));
        olist.appendChild(el("span", {class:"wlink", text:o.divisionLabel, onclick:(function(dk){return function(){ navigate("/"+dk+"/wrestlers/"+id); };})(o.divisionKey)}));
        var yrs = o.firstYear ? (o.firstYear===o.lastYear ? (""+o.firstYear) : (o.firstYear+"–"+o.lastYear)) : "";
        olist.appendChild(el("span",{class:"ay", text:" ("+yrs+", "+o.appearances+" app"+(o.appearances!==1?"s":"")+(o.bestFinish?", "+o.bestFinish:"")+")"}));
      });
      otherPanel.appendChild(olist);
      otherPanel.appendChild(el("div",{class:"ay", style:"margin-top:8px;", text:"Same wrestler profile, kept as a fully separate stat line per Royal Rumble Database convention — Men's and Women's totals are never added together."}));
      c.appendChild(otherPanel);
    }

    // "Also wrestled as" -- cross-links other gimmick-era wrestler_ids that
    // are this same real performer (see build_dashboard_data.py for the
    // real_name + DOB matching this is built from), scoped to THIS division
    // (a sibling only shows here if they too have a stat line in it). This
    // database deliberately keeps each gimmick era as its own row rather
    // than merging them, so this panel is what makes that split
    // discoverable instead of looking like unrelated wrestlers -- e.g. Big
    // Boss Man's two eras, or Glenn Jacobs as Isaac Yankem / Fake Diesel / Kane.
    if (w.samePerformer && w.samePerformer.length){
      var also = el("div", {class:"also-panel"});
      also.appendChild(el("div", {class:"also-head", text:"Same performer, other gimmicks ("+div.label+")"}));
      var list = el("div", {class:"also-list"});
      w.samePerformer.forEach(function(s, idx){
        if (idx) list.appendChild(document.createTextNode("  ·  "));
        list.appendChild(wlink(s.id, s.name));
        var yrs = s.years && s.years.length ? s.years.join(", ") : "no Rumble entries under this name";
        list.appendChild(el("span",{class:"ay", text:" ("+yrs+")"}));
      });
      also.appendChild(list);
      if (w.combinedStats){
        var cs = w.combinedStats;
        var crow = el("div",{class:"combined-row"});
        [["appearances","Appearances"],["wins","Wins"],["elims","Career Elims"],["winPct","Win %"],["bestFinish","Best Finish"]].forEach(function(pair){
          var v = cs[pair[0]];
          var text = pair[0]==="winPct" ? fmtPct(v) : (pair[0]==="bestFinish" ? (v||"—") : fmtNum(v));
          crow.appendChild(el("div",{class:"kpi"},[el("div",{class:"v",text:text}), el("div",{class:"l",text:pair[1]})]));
        });
        also.appendChild(el("div",{class:"ay",style:"margin-top:10px;",text:"Combined across all gimmicks listed above, within the "+div.label+" only"}));
        also.appendChild(crow);
      }
      c.appendChild(also);
    }

    var kpi = el("div", {class:"kpi-row"});
    [["appearances","Appearances"],["wins","Wins"],["runnerUp","Runner-up"],["finalFour","Final Four"],
     ["elims","Career Elims"],["maxElimsSingle","Best Single"],["avgEntry","Avg Entry #"]].forEach(function(pair){
      var v = w[pair[0]];
      var text = pair[0]==="avgEntry" ? (v!==null&&v!==undefined ? v.toFixed(1) : "—") : fmtNum(v);
      kpi.appendChild(el("div",{class:"kpi"},[el("div",{class:"v",text:text}), el("div",{class:"l",text:pair[1]})]));
    });
    kpi.appendChild(el("div",{class:"kpi"},[el("div",{class:"v",text:fmtPct(w.winPct)}), el("div",{class:"l",text:"Win %"})]));
    c.appendChild(kpi);

    // Rumble-by-Rumble history
    c.appendChild(el("div",{class:"cat-heading section-gap", text:div.label+" — Rumble-by-Rumble history"}));
    var histPanel = el("div", {class:"panel"});
    var histScroll = el("div", {class:"table-scroll"});
    var histTable = el("table", {class:"hist-table"});
    histTable.appendChild(el("thead",{},[el("tr",{},[
      el("th",{text:"Year"}), el("th",{text:"Appearance"}), el("th",{text:"Entry #"}),
      el("th",{text:"Context"}), el("th",{text:"Result"}), el("th",{text:"Time in ring"})
    ])]));
    var histBody = el("tbody");
    (w.history||[]).forEach(function(h){
      var contextCell = el("td", {class:"name-cell"});
      var contextBadges = el("div", {class:"badges"});
      if (h.isRumbleDebut) contextBadges.appendChild(el("span",{class:"chip",text:"Rumble debut"}));
      if (h.isCompanyDebut) contextBadges.appendChild(el("span",{class:"chip",text:"WWE debut"}));
      if (h.isReturning) contextBadges.appendChild(el("span",{class:"chip",text:"Return"}));
      if (h.championship) contextBadges.appendChild(el("span",{class:"chip",text:"Champion"}));
      if (h.titleLostSameCard && !h.championship) contextBadges.appendChild(el("span",{class:"chip",text:"Lost title earlier"}));
      if (contextBadges.children.length) contextCell.appendChild(contextBadges);
      if (h.championship){
        var champDetail = h.championship.title;
        if (h.championship.daysIntoReign!==null && h.championship.daysIntoReign!==undefined) champDetail += " · day "+h.championship.daysIntoReign;
        if (h.championship.partner) champDetail += " · with "+h.championship.partner;
        if (h.championship.defendedSameCard) champDetail += " · defended earlier";
        if (h.championship.lostSameCard) champDetail += " · lost earlier";
        contextCell.appendChild(el("div",{class:"method-note",text:champDetail}));
      }
      if (h.isCompanyDebut && h.companyDebutDate) contextCell.appendChild(el("div",{class:"method-note",text:h.companyDebutDate}));
      if (h.isReturning) contextCell.appendChild(el("div",{class:"method-note",text:h.absenceLength ? h.absenceLength : "Absence length not established"}));
      if (!contextCell.children.length) contextCell.appendChild(document.createTextNode("—"));
      var resultCell = el("td");
      if (h.neverEntered){
        resultCell.appendChild(document.createTextNode("Drew a number, never entered"));
      } else if (h.isWinner){
        resultCell.appendChild(el("span",{class:"result-win", text:"Won"}));
      } else if (h.isRunnerUp){
        resultCell.appendChild(el("span",{class:"result-runnerup", text:"Runner-up"}));
      } else {
        var byTxt = h.by && h.by.length ? h.by.map(function(b){return b.name;}).join(" & ") : "unrecorded";
        resultCell.appendChild(document.createTextNode((h.elimNum?("#"+h.elimNum+" out"):"Eliminated")+(h.isSelf?" (self)":"")+" — by "+byTxt));
      }
      if (h.elimsMade) resultCell.appendChild(el("div",{class:"method-note", text:h.elimsMade+" elimination"+(h.elimsMade!==1?"s":"")+" made"}));
      histBody.appendChild(el("tr", {onclick:(function(eid){return function(){navigate("/"+div.key+"/events/"+eid);};})(h.eventId)}, [
        el("td",{class:"num", text:h.year}),
        el("td",{class:"num", text:h.appearanceNo ? ("#"+h.appearanceNo) : "—"}),
        el("td",{class:"num", text:h.entry!==null&&h.entry!==undefined?h.entry:"—"}),
        contextCell,
        resultCell,
        el("td",{class:"num", text:h.neverEntered?"—":(h.ringTime||"—")})
      ]));
    });
    histTable.appendChild(histBody);
    histScroll.appendChild(histTable);
    histPanel.appendChild(histScroll);
    if (!(w.history||[]).length) histPanel.appendChild(el("div",{class:"sub", text:"No Rumble appearances recorded."}));
    c.appendChild(histPanel);

    // Championship-at-entry and debut/return detail are already sourced on
    // each entrant row. These panels expose them without reclassifying or
    // supplementing any underlying fact.
    var championshipHistory = (w.history||[]).filter(function(h){ return h.championship || h.titleLostSameCard; });
    var careerMilestones = (w.history||[]).filter(function(h){ return h.isRumbleDebut || h.isCompanyDebut || h.isReturning; });
    if (championshipHistory.length || careerMilestones.length){
      var contextCols = el("div", {class:"ev-cols section-gap"});
      if (championshipHistory.length){
        var champPanel = el("div", {class:"panel"});
        champPanel.appendChild(el("h3", {text:"Championship status at entry"}));
        champPanel.appendChild(el("div", {class:"sub", text:"Titles held when the Rumble match began, plus titles lost earlier on the same card"}));
        championshipHistory.forEach(function(h){
          var ch = h.championship;
          var title = ch ? ch.title : "Title lost earlier on the card";
          var detail = [];
          if (ch && ch.reignNumber) detail.push("reign #"+ch.reignNumber);
          if (ch && ch.daysIntoReign!==null && ch.daysIntoReign!==undefined) detail.push("day "+ch.daysIntoReign);
          if (ch && ch.partner) detail.push("partner: "+ch.partner);
          if (h.titleDefendedSameCard) detail.push("defended earlier on card");
          if (h.titleLostSameCard) detail.push("lost earlier on card");
          champPanel.appendChild(el("div",{class:"rec-mini",onclick:(function(eid){return function(){navigate("/"+div.key+"/events/"+eid);};})(h.eventId)},[
            el("div",{},[el("div",{text:title}),el("div",{class:"cat",text:detail.join(" · ")})]),
            el("div",{class:"val",style:"font-family:var(--font-d); color:var(--accent);",text:String(h.year)})
          ]));
        });
        contextCols.appendChild(champPanel);
      }
      if (careerMilestones.length){
        var milestonePanel = el("div", {class:"panel"});
        milestonePanel.appendChild(el("h3", {text:"Debuts and returns"}));
        milestonePanel.appendChild(el("div", {class:"sub", text:"Rumble debuts, WWE debuts and documented returns"}));
        careerMilestones.forEach(function(h){
          var labels=[];
          if (h.isRumbleDebut) labels.push("Rumble debut");
          if (h.isCompanyDebut) labels.push("WWE debut"+(h.companyDebutDate?" ("+h.companyDebutDate+")":""));
          if (h.isReturning) labels.push("Return"+(h.absenceLength?" — "+h.absenceLength:" — absence length not established"));
          milestonePanel.appendChild(el("div",{class:"rec-mini",onclick:(function(eid){return function(){navigate("/"+div.key+"/events/"+eid);};})(h.eventId)},[
            el("div",{},[el("div",{text:labels.join(" · ")}),el("div",{class:"cat",text:"Rumble appearance #"+(h.appearanceNo||"?")})]),
            el("div",{class:"val",style:"font-family:var(--font-d); color:var(--accent);",text:String(h.year)})
          ]));
        });
        contextCols.appendChild(milestonePanel);
      }
      c.appendChild(contextCols);
    }

    // Every value below is appearance-specific. This keeps changing billed
    // measurements, hometowns and characters attached to the event where
    // they were used instead of flattening them into a misleading career fact.
    if ((w.history||[]).length){
      c.appendChild(el("div",{class:"cat-heading section-gap", text:"Rumble-by-Rumble profile history"}));
      var profilePanel = el("div", {class:"panel"});
      profilePanel.appendChild(el("div", {class:"sub", text:"Billed physical profile, alignment, character and affiliations at each appearance. Blank character fields mean no sourced value is currently recorded, not a verified absence."}));
      var profileScroll = el("div", {class:"table-scroll", style:"margin-top:10px;"});
      var profileTable = el("table", {class:"hist-table"});
      profileTable.appendChild(el("thead",{},[el("tr",{},[
        el("th",{text:"Year"}), el("th",{text:"Age"}), el("th",{text:"Height"}),
        el("th",{text:"Weight"}), el("th",{text:"Billed from"}), el("th",{text:"Alignment"}),
        el("th",{text:"Gimmick"}), el("th",{text:"Manager"}), el("th",{text:"Team / faction"})
      ])]));
      var profileBody = el("tbody");
      (w.history||[]).forEach(function(h){
        var pp = h.physicalProfile || {}, cp = h.characterProfile || {};
        function statusCell(value, status, suffix){
          var td=el("td");
          td.appendChild(document.createTextNode(value ? (value+(suffix||"")) : "—"));
          if (value && status && status.toUpperCase() !== "CONFIRMED") td.appendChild(el("span",{class:"quality-pill "+qualityClass(status,false),text:qualityLabel(status,false)}));
          return td;
        }
        var affiliation = [cp.tagTeam, cp.faction && cp.faction!==cp.tagTeam ? cp.faction : null].filter(Boolean).join(" · ");
        profileBody.appendChild(el("tr",{onclick:(function(eid){return function(){navigate("/"+div.key+"/events/"+eid);};})(h.eventId)},[
          el("td",{class:"num",text:h.year}),
          statusCell(pp.age, pp.ageStatus, ""),
          statusCell(pp.heightM, pp.status, pp.heightM?" m":""),
          statusCell(pp.weightKg, pp.status, pp.weightKg?" kg":""),
          statusCell(pp.billedFrom, pp.status, ""),
          statusCell(cp.alignment, cp.alignmentStatus, ""),
          el("td",{text:cp.gimmick||"—"}),
          el("td",{text:cp.manager||"—"}),
          el("td",{text:affiliation||"—"})
        ]));
      });
      profileTable.appendChild(profileBody);
      profileScroll.appendChild(profileTable);
      profilePanel.appendChild(profileScroll);
      c.appendChild(profilePanel);
    }

    // Records held + Notable moments
    var hasRecords = w.recordsHeld && w.recordsHeld.length;
    var hasMoments = w.notableMoments && w.notableMoments.length;
    if (hasRecords || hasMoments){
      var cols2 = el("div", {class:"ev-cols section-gap"});
      if (hasRecords){
        var recPanel = el("div", {class:"panel"});
        recPanel.appendChild(el("h3", {text:"Records held"}));
        recPanel.appendChild(el("div", {class:"sub", text:"All-time "+div.label+" records this wrestler currently holds"}));
        w.recordsHeld.forEach(function(r){
          recPanel.appendChild(el("div",{class:"rec-mini"},[
            el("div",{},[document.createTextNode(r.name), el("div",{class:"cat", text:r.category})]),
            el("div",{class:"val", style:"font-family:var(--font-d); color:var(--accent);", text:r.value})
          ]));
        });
        cols2.appendChild(recPanel);
      }
      if (hasMoments){
        var momPanel2 = el("div", {class:"panel"});
        momPanel2.appendChild(el("h3", {text:"Notable moments"}));
        momPanel2.appendChild(el("div", {class:"sub", text:"Weird, wonderful and behind-the-scenes findings involving this wrestler"}));
        w.notableMoments.forEach(function(m){
          var row = el("div", {class:"moment-row"});
          var head = el("div", {class:"moment-head"}, [el("div", {class:"moment-title", text:m.title || ""})]);
          if (m.quality && m.quality.toLowerCase() !== "confirmed"){
            head.appendChild(el("span", {class:"quality-pill "+qualityClass(m.quality,false), text:qualityLabel(m.quality,false)}));
          }
          row.appendChild(head);
          if (m.description) row.appendChild(el("div", {class:"moment-desc", text:m.description}));
          var evLink = el("div",{class:"method-note", style:"margin-top:6px; cursor:pointer;", text:(byId[m.eventId]?byId[m.eventId].year:m.eventId)+" — view event"});
          evLink.addEventListener("click", (function(eid){return function(){navigate("/"+div.key+"/events/"+eid);};})(m.eventId));
          row.appendChild(evLink);
          momPanel2.appendChild(row);
        });
        cols2.appendChild(momPanel2);
      }
      c.appendChild(cols2);
    }

    // Rivalries -- repeat (2+) eliminator/eliminated pairings involving this
    // wrestler, split by direction. A single past elimination isn't shown
    // here (it's already in the Rumble-by-Rumble history table above); this
    // is specifically for opponents this wrestler keeps running into.
    var riv = w.rivalries || {};
    var hasRivAsElim = riv.asEliminator && riv.asEliminator.length;
    var hasRivAsVictim = riv.asVictim && riv.asVictim.length;
    if (hasRivAsElim || hasRivAsVictim){
      c.appendChild(el("div",{class:"cat-heading section-gap", text:"Rivalries"}));
      var rcols = el("div", {class:"ev-cols"});
      function rivalryPanel(title, sub, list){
        var p = el("div", {class:"panel"});
        p.appendChild(el("h3", {text:title}));
        p.appendChild(el("div", {class:"sub", text:sub}));
        list.forEach(function(r){
          var yf = byId[r.firstEventId] ? byId[r.firstEventId].year : "";
          var yl = byId[r.mostRecentEventId] ? byId[r.mostRecentEventId].year : "";
          var yrTxt = (yf && yl) ? (yf === yl ? (""+yf) : (yf+"–"+yl)) : "";
          p.appendChild(el("div",{class:"rec-mini"},[
            el("div",{},[wlink(r.id, r.name), el("div",{class:"cat", text:yrTxt})]),
            el("div",{class:"val", style:"font-family:var(--font-d); color:var(--accent);", text:"×"+r.times})
          ]));
        });
        return p;
      }
      if (hasRivAsElim) rcols.appendChild(rivalryPanel("Eliminated repeatedly", "Opponents this wrestler has personally eliminated more than once", riv.asEliminator));
      if (hasRivAsVictim) rcols.appendChild(rivalryPanel("Eliminated by, repeatedly", "Opponents who have personally eliminated this wrestler more than once", riv.asVictim));
      c.appendChild(rcols);
    }

    c.appendChild(el("div",{class:"footnote", text:"Bio facts carry the same CONFIRMED / PROBABLE / CONFLICTING status as everything else in this database — an unlabeled fact is CONFIRMED by at least 2 independent sources; a pill next to a fact means it's resting on less than that."}));

    return c;
  }

  // ---------------- render ----------------
  function render(){
    var r = parseHash();
    renderNav(r);
    var content = document.getElementById("content");
    content.innerHTML = "";
    content.scrollTop = 0;
    window.scrollTo(0,0);

    if (r.page === "explore"){
      CUR_DIV = null;
      content.appendChild(pageExplore(r.arg));
      return;
    }
    if (r.page === "map"){
      CUR_DIV = null;
      content.appendChild(pageWorldMap());
      return;
    }
    if (r.page === "titles"){
      CUR_DIV = null;
      content.appendChild(pageTitles(r.arg));
      return;
    }
    if (!r.division || r.page === "home"){
      CUR_DIV = null;
      content.appendChild(pageHome());
      return;
    }
    var div = getDivision(r.division);
    if (!div){
      CUR_DIV = null;
      content.appendChild(pageHome());
      return;
    }
    CUR_DIV = r.division;
    if (r.page === "events" && !r.arg) content.appendChild(pageEvents(div));
    else if (r.page === "events" && r.arg) content.appendChild(pageEventDetail(div, r.arg));
    else if (r.page === "records") content.appendChild(pageRecords(div));
    else if (r.page === "wrestlers" && !r.arg) content.appendChild(pageWrestlers(div));
    else if (r.page === "wrestlers" && r.arg) content.appendChild(pageWrestlerDetail(div, r.arg));
    else if (r.page === "entry-numbers") content.appendChild(pageEntryNumbers(div));
    else if (r.page === "locations") content.appendChild(pageLocations(div));
    else if (r.page === "commentators") content.appendChild(pageCommentators(div));
    else content.appendChild(pageEvents(div));
  }

  // ---------------- boot ----------------
  fetch(DATA_URL).then(function(r){ return r.json(); }).then(function(data){
    DB = data;
    (DB.divisions||[]).forEach(function(d){
      d._byWid = {};
      d.wrestlers.forEach(function(w){ d._byWid[w.id] = w; });
      d.events.forEach(function(ev){ byId[ev.id] = ev; });
      // Year range is computed from the data rather than hardcoded, so this
      // stays correct as new events are added without an HTML edit each time.
      var years = d.events.map(function(ev){ return parseInt(ev.year, 10); }).filter(function(y){ return !isNaN(y); });
      d._minYear = years.length ? Math.min.apply(null, years) : null;
      d._maxYear = years.length ? Math.max.apply(null, years) : null;
    });
    render();
  }).catch(function(err){
    document.getElementById("content").innerHTML =
      "<div id='loading'>Couldn’t load the database (" + (err && err.message ? err.message : "unknown error") + ").</div>";
  });
})();
</script>
