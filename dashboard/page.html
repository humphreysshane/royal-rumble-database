<meta charset="utf-8">
<title>Royal Rumble Database</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#faf8f4; --surface:#ffffff; --surface-2:#f2efe6; --surface-3:#ece7db;
    --ink:#17140d; --ink-2:#57503f; --ink-3:#8a8272;
    --border:rgba(23,20,13,0.11); --border-strong:rgba(23,20,13,0.20);
    --accent:#9d7200; --accent-strong:#7a5900; --accent-wash:#f4e6c2; --accent-wash-2:#ece0bd;
    --accent-ink: #17140d; /* ink to place on accent-wash */
    --good:#0ca30c; --warning:#b8790a; --serious:#c1552f; --critical:#d03b3b;
    --good-wash:#dff3df; --warning-wash:#faedd1; --critical-wash:#fbdfdd;
    --font-d:'Oswald',system-ui,-apple-system,sans-serif;
    --font-b:'Inter',system-ui,-apple-system,sans-serif;
    --radius:3px;
    color-scheme:light;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#100d08; --surface:#1a160e; --surface-2:#221d13; --surface-3:#2b2417;
      --ink:#f7f4ec; --ink-2:#cabfa4; --ink-3:#8f8672;
      --border:rgba(255,255,255,0.12); --border-strong:rgba(255,255,255,0.22);
      --accent:#e3ae28; --accent-strong:#f0bb3b; --accent-wash:#3a2f13; --accent-wash-2:#4a3c19;
      --accent-ink:#17140d;
      --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#e66767;
      --good-wash:#123317; --warning-wash:#3a2c0d; --critical-wash:#3a1414;
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#100d08; --surface:#1a160e; --surface-2:#221d13; --surface-3:#2b2417;
    --ink:#f7f4ec; --ink-2:#cabfa4; --ink-3:#8f8672;
    --border:rgba(255,255,255,0.12); --border-strong:rgba(255,255,255,0.22);
    --accent:#e3ae28; --accent-strong:#f0bb3b; --accent-wash:#3a2f13; --accent-wash-2:#4a3c19;
    --accent-ink:#17140d;
    --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#e66767;
    --good-wash:#123317; --warning-wash:#3a2c0d; --critical-wash:#3a1414;
    color-scheme:dark;
  }

  *{box-sizing:border-box;}
  body{background:var(--bg); color:var(--ink); font-family:var(--font-b); line-height:1.45;}
  a{color:inherit; text-decoration:none;}
  h1,h2,h3,h4{font-family:var(--font-d); font-weight:600; text-wrap:balance; margin:0; letter-spacing:0.01em;}
  table{border-collapse:collapse; width:100%;}
  button{font:inherit; color:inherit;}
  ::selection{background:var(--accent-wash);}

  #shell{display:flex; min-height:100%; max-width:1400px; margin:0 auto;}

  /* ---------- side nav ---------- */
  #nav{
    flex:0 0 auto; width:230px; padding:20px 14px; border-right:1px solid var(--border);
    position:sticky; top:env(safe-area-inset-top,0px); align-self:flex-start;
    height:100dvh; overflow-y:auto; background:var(--bg);
  }
  .brand{padding:6px 8px 18px; border-bottom:1px solid var(--border); margin-bottom:14px;}
  .brand .eyebrow{font-family:var(--font-d); font-size:11px; letter-spacing:0.14em; color:var(--accent); text-transform:uppercase;}
  .brand h1{font-size:21px; line-height:1.1; margin-top:4px;}
  .navlink{
    display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:var(--radius);
    font-family:var(--font-d); font-size:14px; letter-spacing:0.02em; color:var(--ink-2); cursor:pointer;
    border-left:3px solid transparent;
  }
  .navlink:hover{background:var(--surface-2); color:var(--ink);}
  .navlink.active{background:var(--accent-wash); color:var(--accent-ink); border-left-color:var(--accent); font-weight:600;}
  .navsection{font-family:var(--font-d); font-size:10.5px; letter-spacing:0.12em; text-transform:uppercase; color:var(--ink-3); margin:16px 0 4px; padding-left:10px;}
  .navsection:first-of-type{margin-top:10px;}
  .navmeta{margin-top:18px; padding-top:14px; border-top:1px solid var(--border); font-size:11.5px; color:var(--ink-3); padding-left:10px;}
  .navmeta div{margin-bottom:3px;}

  /* mobile top bar */
  #topbar{display:none;}
  #tabs{display:none;}
  @media (max-width:820px){
    #shell{flex-direction:column;}
    #nav{display:none;}
    #topbar{
      display:flex; align-items:center; justify-content:space-between; gap:10px;
      padding:12px 16px; padding-top:calc(12px + env(safe-area-inset-top,0px));
      border-bottom:1px solid var(--border); position:sticky; top:0; background:var(--bg); z-index:20;
    }
    #topbar .brand{border:0; padding:0; margin:0;}
    #topbar .brand h1{font-size:17px;}
    #tabs{display:flex; gap:4px; padding:8px 12px 12px; overflow-x:auto; border-bottom:1px solid var(--border); background:var(--bg); position:sticky; top:52px; z-index:19;}
    #tabs .navlink{white-space:nowrap; border-left:0; border-bottom:3px solid transparent;}
    #tabs .navlink.active{border-left:0; border-bottom-color:var(--accent);}
  }

  /* ---------- content ---------- */
  #content{flex:1 1 auto; min-width:0; padding:28px 32px 80px; padding-top:calc(28px + env(safe-area-inset-top,0px));}
  @media (max-width:820px){ #content{padding:20px 16px 60px;} }
  .container{max-width:1100px;}
  .page-head{margin-bottom:22px;}
  .page-head .eyebrow{font-family:var(--font-d); font-size:12px; letter-spacing:0.12em; color:var(--accent); text-transform:uppercase; margin-bottom:6px;}
  .page-head h2{font-size:30px;}
  .page-head p{color:var(--ink-2); margin-top:8px; max-width:70ch;}

  /* ---------- kpi row ---------- */
  .kpi-row{display:grid; grid-template-columns:repeat(auto-fit,minmax(128px,1fr)); gap:1px; background:var(--border); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; margin:22px 0;}
  .kpi{background:var(--surface); padding:16px 16px;}
  .kpi .v{font-family:var(--font-d); font-size:28px; font-variant-numeric:normal;}
  .kpi .l{font-size:12px; color:var(--ink-3); margin-top:2px;}

  /* ---------- cards / grids ---------- */
  .grid{display:grid; gap:12px;}
  .grid.events{grid-template-columns:repeat(auto-fill,minmax(210px,1fr));}
  .grid.records{grid-template-columns:repeat(auto-fill,minmax(240px,1fr));}
  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:16px; cursor:pointer; transition:border-color .12s ease, transform .12s ease;
  }
  .card:hover{border-color:var(--border-strong); transform:translateY(-1px);}
  .ev-card .yr{font-family:var(--font-d); font-size:26px; color:var(--accent);}
  .ev-card .nm{font-size:13px; color:var(--ink-2); margin-top:2px;}
  .ev-card .wn{font-size:12.5px; margin-top:10px; padding-top:10px; border-top:1px solid var(--border); color:var(--ink-3);}
  .ev-card .wn b{color:var(--ink); font-weight:600;}

  .rec-card{cursor:default;}
  .rec-card.actionable{cursor:pointer;}
  .rec-card.actionable:hover{border-color:var(--accent);}
  .rec-card .cat{font-family:var(--font-d); font-size:10.5px; letter-spacing:0.1em; text-transform:uppercase; color:var(--ink-3);}
  .rec-card .nm{font-size:13.5px; margin-top:4px; font-weight:600; min-height:2.6em;}
  .rec-card .val{font-family:var(--font-d); font-size:24px; color:var(--accent); margin-top:8px;}
  .rec-card .holder{font-size:12.5px; color:var(--ink-2); margin-top:2px;}
  .rec-card .note{font-size:11.5px; color:var(--ink-3); margin-top:8px; padding-top:8px; border-top:1px solid var(--border);}
  .rec-card .member-toggle{cursor:pointer; color:var(--accent); font-weight:600; user-select:none;}
  .rec-card .member-toggle:hover{color:var(--accent-strong);}
  .rec-card .member-list{display:none; margin-top:6px; padding-top:2px;}
  .rec-card .member-row{display:flex; justify-content:space-between; gap:10px; font-size:12px; color:var(--ink-2); padding:3px 0; border-bottom:1px solid var(--border);}
  .rec-card .member-row:last-child{border-bottom:0;}
  .rec-card .member-row .d{color:var(--ink-3); font-variant-numeric:tabular-nums; white-space:nowrap;}

  .search{
    width:100%; max-width:340px; padding:9px 12px; border:1px solid var(--border-strong); border-radius:var(--radius);
    background:var(--surface); color:var(--ink); font-family:var(--font-b); font-size:14px;
  }
  .search:focus{outline:2px solid var(--accent); outline-offset:1px;}

  /* ---------- event detail ---------- */
  .backlink{font-family:var(--font-d); font-size:13px; color:var(--ink-2); cursor:pointer; display:inline-flex; align-items:center; gap:6px; margin-bottom:14px;}
  .backlink:hover{color:var(--accent);}
  .ev-hero{border:1px solid var(--border); border-radius:var(--radius); background:var(--surface); padding:22px 24px; margin-bottom:20px;}
  .ev-hero .yr{font-family:var(--font-d); font-size:42px; line-height:1;}
  .ev-hero .mn{color:var(--ink-2); font-size:14px; margin-top:4px;}
  .factrow{display:flex; flex-wrap:wrap; gap:20px 32px; margin-top:16px; padding-top:16px; border-top:1px solid var(--border);}
  .fact .l{font-size:10.5px; letter-spacing:0.08em; text-transform:uppercase; color:var(--ink-3);}
  .fact .v{font-size:14.5px; margin-top:2px; font-weight:500;}
  .badge-winner{display:inline-block; background:var(--accent-wash); color:var(--accent-ink); font-family:var(--font-d); font-size:11px; letter-spacing:0.06em; padding:2px 8px; border-radius:20px; margin-left:8px; vertical-align:1px;}
  .sig{margin-top:16px; padding-top:16px; border-top:1px solid var(--border); font-size:13.5px; color:var(--ink-2); max-width:80ch;}

  .moment-row{padding:12px 0; border-bottom:1px solid var(--border);}
  .moment-row:last-child{border-bottom:0; padding-bottom:0;}
  .moment-row:first-of-type{padding-top:2px;}
  .moment-head{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  .moment-title{font-family:var(--font-d); font-size:14.5px; font-weight:500;}
  .moment-desc{font-size:13px; color:var(--ink-2); margin-top:5px; max-width:80ch;}

  .ev-cols{display:grid; grid-template-columns:1fr 1.3fr; gap:22px; align-items:start;}
  @media (max-width:900px){ .ev-cols{grid-template-columns:1fr;} }
  .panel{border:1px solid var(--border); border-radius:var(--radius); background:var(--surface); padding:18px 20px;}
  .panel h3{font-size:15px; margin-bottom:2px;}
  .panel .sub{font-size:12px; color:var(--ink-3); margin-bottom:14px;}

  /* bar chart */
  .bar-row{display:flex; align-items:center; gap:10px; padding:3px 0;}
  .bar-row .nm{flex:0 0 118px; font-size:12px; color:var(--ink-2); text-align:right; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .bar-track{flex:1 1 auto; position:relative; height:16px; background:var(--surface-2); border-radius:2px;}
  .bar-fill{position:absolute; top:0; left:0; height:100%; background:var(--accent); border-radius:2px 4px 4px 2px; min-width:2px;}
  .bar-fill.winner{background:var(--accent-strong);}
  .bar-val{flex:0 0 48px; font-size:11.5px; color:var(--ink-3); font-variant-numeric:tabular-nums;}

  /* ---------- world map ---------- */
  .worldmap-panel{border:1px solid var(--border); border-radius:var(--radius); background:linear-gradient(145deg,var(--surface),var(--surface-2)); padding:18px 20px; position:relative; overflow:hidden;}
  .worldmap-svg{width:100%; height:auto; display:block; border-radius:4px; background:linear-gradient(180deg,#dbeaf1 0%,#eff6f8 62%,#d9e8ee 100%); cursor:grab; touch-action:none;}
  .worldmap-svg.dragging{cursor:grabbing;}
  .worldmap-land{fill:#d6d8cd; stroke:#a9afa2; stroke-width:1; filter:drop-shadow(0 2px 2px rgba(31,45,38,.12));}
  .worldmap-grat{stroke:var(--border); stroke-width:0.7; fill:none;}
  .worldmap-marker{fill:var(--accent); stroke:var(--surface); stroke-width:1.5; cursor:pointer;
    transition:transform .15s ease, fill .12s ease; transform-box:fill-box; transform-origin:center;}
  .worldmap-marker:hover, .worldmap-marker.hovered, .worldmap-marker.selected{fill:var(--accent-strong); transform:scale(1.18);}
  .worldmap-marker-sheen{fill:#fff; opacity:0.3; pointer-events:none;}
  .worldmap-label{font-family:var(--font-d); font-size:11px; fill:var(--ink-2); paint-order:stroke; stroke:var(--surface-2); stroke-width:3px; stroke-linejoin:round; pointer-events:none;}
  .worldmap-legend-text{font-family:var(--font-b); font-size:10.5px; fill:var(--ink-3);}
  .worldmap-legend-dot{fill:var(--accent); opacity:0.55; stroke:var(--surface); stroke-width:1;}
  .worldmap-tooltip{
    position:absolute; pointer-events:none; background:var(--surface); border:1px solid var(--border-strong);
    border-radius:var(--radius); padding:8px 11px; font-size:12px; color:var(--ink); max-width:230px;
    box-shadow:0 6px 20px rgba(0,0,0,0.18); z-index:10; display:none;
  }
  .worldmap-tooltip .t-name{font-family:var(--font-d); font-size:13.5px; margin-bottom:2px;}
  .worldmap-tooltip .t-sub{color:var(--ink-3); font-size:11px;}
  .worldmap-tooltip .t-hint{color:var(--accent); font-size:10.5px; margin-top:5px; font-weight:600;}
  .worldmap-table{margin-top:18px;}
  .country-row{border-bottom:1px solid var(--border); padding-bottom:2px; margin-bottom:2px; scroll-margin-top:20px;}
  .country-row:last-child{border-bottom:0;}
  .country-row .bar-row{cursor:pointer; border-radius:2px; transition:background .1s ease;}
  .country-row .bar-row:hover{background:var(--surface-2);}
  .country-row.open .bar-row{background:var(--accent-wash);}
  .country-roster{display:none; margin:4px 0 10px 128px; padding:8px 12px; background:var(--surface-2); border-radius:2px;}
  .country-row.open .country-roster{display:block;}
  .country-roster .cr-nat{font-size:10.5px; letter-spacing:0.06em; text-transform:uppercase; color:var(--ink-3); margin:6px 0 3px;}
  .country-roster .cr-nat:first-child{margin-top:0;}
  .country-roster .cr-names{font-size:12.5px; line-height:1.9;}
  .country-roster .cr-names .wlink{margin-right:2px;}
  .country-roster .cr-sep{color:var(--ink-3); margin:0 3px;}
  @media (max-width:820px){ .country-roster{margin-left:0;} }

  .layer-toggle{display:inline-flex; gap:2px; background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius); padding:2px; margin-bottom:16px;}
  .layer-toggle button{padding:7px 16px; border:0; background:transparent; border-radius:2px; font-family:var(--font-d); font-size:13px; letter-spacing:0.02em; color:var(--ink-2); cursor:pointer;}
  .layer-toggle button:hover{color:var(--ink);}
  .layer-toggle button.active{background:var(--accent-wash); color:var(--accent-ink); font-weight:600;}
  .worldmap-marker.city-marker{stroke-width:1;}
  .worldmap-controls{position:absolute; top:28px; right:30px; z-index:12; display:flex; flex-direction:column; gap:4px;}
  .worldmap-controls button{width:34px; height:34px; border:1px solid var(--border-strong); background:var(--surface); color:var(--ink); border-radius:4px; cursor:pointer; font:600 16px var(--font-d); box-shadow:0 2px 8px rgba(0,0,0,.12);}
  .worldmap-controls button:last-child{font-size:10px; width:auto; padding:0 8px;}
  .map-help{font-size:11px; color:var(--ink-3); margin:0 0 8px;}
  .map-roster-drawer{margin-top:12px; border:1px solid var(--accent); background:var(--surface); border-radius:var(--radius); padding:14px 16px; display:none;}
  .map-roster-drawer.open{display:block;}
  .map-roster-head{display:flex; justify-content:space-between; gap:12px; align-items:center; margin-bottom:8px;}
  .map-roster-head h3{margin:0;}
  .promotion-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:10px;}
  .promotion-card{border:1px solid var(--border); border-radius:var(--radius); background:var(--surface); padding:14px; cursor:pointer;}
  .promotion-card:hover,.promotion-card.selected{border-color:var(--accent); background:var(--accent-wash);}
  .promotion-card .abbr{font-family:var(--font-d); font-size:22px; color:var(--accent);}
  .promotion-card .pname{font-size:12px; color:var(--ink-2); margin-top:2px;}
  .card-match{display:grid; grid-template-columns:48px minmax(150px,1fr) 2fr auto; gap:12px; align-items:start; padding:10px 0; border-bottom:1px solid var(--border); font-size:13px;}
  .card-match:last-child{border-bottom:0;}
  .card-match .match-no{font-family:var(--font-d); color:var(--accent);}
  @media (max-width:700px){.card-match{grid-template-columns:58px 1fr;}.card-match>:nth-child(3),.card-match>:nth-child(4){grid-column:2;}}

  /* elimination timeline table */
  .elim-table{font-size:13px;}
  .elim-table th{
    text-align:left; font-family:var(--font-d); font-size:10.5px; letter-spacing:0.07em; text-transform:uppercase;
    color:var(--ink-3); font-weight:500; padding:6px 8px; border-bottom:1px solid var(--border-strong); position:sticky; top:0; background:var(--surface);
  }
  .elim-table td{padding:7px 8px; border-bottom:1px solid var(--border); vertical-align:top;}
  .elim-table tr:hover td{background:var(--surface-2);}
  .elim-table .num{font-variant-numeric:tabular-nums; color:var(--ink-3);}
  .name-cell b{font-weight:600;}
  .name-cell .badges{margin-top:2px;}
  .chip{display:inline-block; font-size:10px; padding:1px 6px; border-radius:10px; background:var(--surface-3); color:var(--ink-2); margin-right:4px; margin-top:2px;}
  .quality-pill{display:inline-flex; align-items:center; gap:4px; font-size:10.5px; padding:1px 7px; border-radius:10px; white-space:nowrap;}
  .quality-pill.confirmed{background:var(--good-wash); color:var(--good);}
  .quality-pill.probable{background:var(--warning-wash); color:var(--warning);}
  .quality-pill.disputed, .quality-pill.conflicting{background:var(--critical-wash); color:var(--critical);}
  .quality-pill.unknown{background:var(--surface-3); color:var(--ink-3);}
  .by-list{font-size:12.5px;}
  .method-note{font-size:11.5px; color:var(--ink-3); margin-top:2px; max-width:32ch;}
  .table-scroll{overflow-x:auto; margin:0 -20px; padding:0 20px;}

  /* stats table */
  #stats-table-wrap{overflow-x:auto;}
  #stats-table{font-size:13px; min-width:760px;}
  #stats-table th{
    text-align:right; font-family:var(--font-d); font-size:10.5px; letter-spacing:0.05em; text-transform:uppercase;
    color:var(--ink-3); font-weight:500; padding:8px 10px; border-bottom:2px solid var(--border-strong); cursor:pointer; white-space:nowrap;
  }
  #stats-table th:first-child, #stats-table td:first-child{text-align:left;}
  #stats-table th.sorted{color:var(--accent);}
  #stats-table th .arrow{margin-left:3px; opacity:0.7;}
  #stats-table td{padding:7px 10px; border-bottom:1px solid var(--border); text-align:right; font-variant-numeric:tabular-nums;}
  #stats-table td:first-child{font-variant-numeric:normal; text-align:left; font-weight:500;}
  #stats-table tbody tr:hover td{background:var(--surface-2);}
  #stats-table .rank{color:var(--ink-3); font-size:11.5px; width:34px;}

  .section-gap{margin-top:40px;}
  .cat-heading{font-family:var(--font-d); font-size:16px; margin:26px 0 10px; padding-bottom:6px; border-bottom:1px solid var(--border);}
  .cat-heading:first-child{margin-top:0;}

  .footnote{font-size:11.5px; color:var(--ink-3); margin-top:30px; padding-top:16px; border-top:1px solid var(--border); max-width:70ch;}

  #loading{padding:60px 0; text-align:center; color:var(--ink-3); font-family:var(--font-d);}

  /* ---------- wrestler links & profile page ---------- */
  .wlink{cursor:pointer; color:inherit; border-bottom:1px solid var(--border-strong); transition:color .1s ease, border-color .1s ease;}
  .wlink:hover{color:var(--accent); border-color:var(--accent);}
  #stats-table td:first-child .wlink, .rec-card .holder .wlink, .member-row .wlink{border-bottom-color:transparent;}
  #stats-table tbody tr{cursor:pointer;}

  .wr-hero{border:1px solid var(--border); border-radius:var(--radius); background:var(--surface); padding:22px 24px; margin-bottom:20px;}
  .wr-hero .nm{font-family:var(--font-d); font-size:34px; line-height:1.1;}
  .wr-hero .aliases{font-size:12.5px; color:var(--ink-3); margin-top:4px;}
  .badge-deceased{display:inline-block; background:var(--critical-wash); color:var(--critical); font-family:var(--font-d); font-size:11px; letter-spacing:0.06em; padding:2px 8px; border-radius:20px; margin-left:8px; vertical-align:2px;}
  .badge-hof{display:inline-block; background:var(--accent-wash); color:var(--accent-ink); font-family:var(--font-d); font-size:11px; letter-spacing:0.06em; padding:2px 8px; border-radius:20px; margin-left:8px; vertical-align:2px;}
  .fact .v .quality-pill{margin-left:6px; vertical-align:1px;}

    text-align:left; font-family:var(--font-d); font-size:10.5px; letter-spacing:0.05em; text-transform:uppercase;

<div id="topbar">
  <div class="brand">
    <div class="eyebrow">Opta for the</div>
    <h1>Royal Rumble</h1>
  </div>
</div>
<div id="tabs"></div>

<div id="shell">
  <nav id="nav">
    <div class="brand">
      <div class="eyebrow">Opta for the</div>
      <h1>Royal Rumble</h1>
    </div>
    <div id="navlinks"></div>
    <div class="navmeta" id="navmeta"></div>
  </nav>
  <main id="content"><div id="loading">Loading database…</div></main>
</div>

<script>
(function(){
  "use strict";

  var DATA_URL = "data.json";
  var DB = null;
  var byId = {};   // event id -> event (globally unique across divisions)
  var CUR_DIV = null; // division key ("mens"/"womens") currently being rendered, null on Home

  function el(tag, attrs, children){
    var e = document.createElement(tag);
    attrs = attrs || {};
    for (var k in attrs){
      if (k === "class") e.className = attrs[k];
      else if (k === "html") e.innerHTML = attrs[k];
      else if (k === "text") e.textContent = attrs[k];
      else if (k.indexOf("on") === 0 && typeof attrs[k] === "function") e.addEventListener(k.slice(2), attrs[k]);
      else e.setAttribute(k, attrs[k]);
    }
    (children||[]).forEach(function(c){ if (c) e.appendChild(c); });
    return e;
  }
  function fmtNum(n){ if (n===null||n===undefined) return "—"; return n.toLocaleString(); }
  function fmtPct(n){ if (n===null||n===undefined) return "—"; return n.toFixed(1)+"%"; }
  function fmtDec(n, digits){ if (n===null||n===undefined) return "—"; return n.toLocaleString('en-US', {minimumFractionDigits: digits, maximumFractionDigits: digits}); }
  function fmtSec(s){
    if (s===null||s===undefined) return "—";
    var m = Math.floor(s/60), sec = s%60;
    return m+":"+(sec<10?"0":"")+sec;
  }
  function qualityClass(q, disputed){
    if (disputed) return "disputed";
    if (!q) return "unknown";
    var v = q.toLowerCase();
    if (v==="confirmed") return "confirmed";
    if (v==="probable") return "probable";
    if (v==="conflicting") return "conflicting";
    return "unknown";
  }
  function qualityLabel(q, disputed){
    if (disputed) return "Disputed";
    return q || "Unverified";
  }
  function getDivision(key){
    var list = (DB && DB.divisions) || [];
    for (var i=0;i<list.length;i++) if (list[i].key === key) return list[i];
    return null;
  }
  // A clickable wrestler name -> their profile page, when we actually have a
  // profile for that id IN THE GIVEN DIVISION (each division has its own
  // independent wrestler roster/stat lines -- a wrestler_id who only
  // appeared in the other division has no entry here, so this correctly
  // falls back to plain text rather than linking to a dead-end). Defaults to
  // whichever division is currently being rendered (CUR_DIV); pass divKey
  // explicitly to link across divisions (see otherDivision).
  function wlink(idOrObj, fallbackName, divKey){
    var id = idOrObj && typeof idOrObj === "object" ? idOrObj.id : idOrObj;
    var nm = (idOrObj && typeof idOrObj === "object" ? idOrObj.name : null) || fallbackName || id;
    var dk = divKey || CUR_DIV;
    var div = getDivision(dk);
    if (!id || !div || !div._byWid[id]) return document.createTextNode(nm || "—");
    return el("span", {class:"wlink", text: nm, onclick: function(ev){ ev.stopPropagation(); navigate("/"+dk+"/wrestlers/"+id); }});
  }
  // Like wlink, but for a cross-division context (the World Map) where no
  // single CUR_DIV applies -- resolves whichever division actually holds
  // this wrestler_id (checking Men's first, matching the site's existing
  // "assume Men's, fall back" convention elsewhere) rather than requiring
  // the caller to know it in advance.
  function anyDivWlink(id, name){
    var div = (DB.divisions || []).find(function(d){ return d._byWid && d._byWid[id]; });
    return wlink(id, name, div ? div.key : null);
  }
  // Same cross-division lookup as anyDivWlink, but returns the wrestler
  // record itself (for pulling their canonical display name) rather than a
  // clickable element -- used by the Title Histories page, which links
  // wrestler_ids that were never scoped to a single division to begin with.
  function findWrestlerAnyDiv(id){
    var div = (DB.divisions || []).find(function(d){ return d._byWid && d._byWid[id]; });
    return div ? div._byWid[id] : null;
  }
  // Small badge marking a name as one of several ring identities for the same
  // real performer (e.g. Kane / Isaac Yankem / Fake Diesel), with the sibling
  // names in a hover title so a table row doesn't need extra columns. Scoped
  // to the current division -- a sibling only appears here if THEY also have
  // a stat line in this same division.
  function gimmickBadge(w){
    if (!w || !w.samePerformer || !w.samePerformer.length) return null;
    var others = w.samePerformer.map(function(s){ return s.name; }).join(", ");
    return el("span", {class:"badge-gimmick", text:"also "+w.samePerformer.length+" gimmick"+(w.samePerformer.length>1?"s":""), title:"Same performer also wrestled as: "+others});
  }
  // Small badge marking a wrestler_id that ALSO has a stat line in the other
  // division (e.g. Beth Phoenix: Men's 2010 + Women's 2018) -- the division
  // split otherwise makes this invisible, since her two stat lines never
  // appear on the same page.
  function otherDivisionBadge(w){
    if (!w || !w.otherDivision || !w.otherDivision.length) return null;
    var labels = w.otherDivision.map(function(o){ return o.divisionLabel.replace(" Royal Rumble",""); }).join(", ");
    return el("span", {class:"badge-gimmick", text:"also "+labels, title:"Also wrestled in the "+labels+" Royal Rumble"});
  }
  function fmtDate(d){ return d || "—"; }
  // Records whose single-holder notes text names other tied co-holders
  // (e.g. "TIED with: Viscera (RR2007M, 8)." or "Tied with: Goldust, Rey
  // Mysterio, Honky Tonk Man, The Hurricane.") don't have structured
  // `members` data -- this pulls a clickable list out of that free text
  // instead, for the record card's own expand-on-click treatment. Splits on
  // commas that aren't inside parentheses, so a single entry like
  // "Viscera (RR2007M, 8)" survives as one item rather than being cut by
  // its own internal comma. Each item resolves to either an event id
  // (RRyyyy[M/W/G]) or a wrestler name looked up by exact match (case-
  // insensitive) within the given division; either can fail to resolve, in
  // which case it's still shown, just as plain unlinked text.
  function parseTiedFromNotes(notes, div){
    if (!notes) return null;
    var m = /tied with:?\s*(.+?)(?:\.\s*$|\.\s|$)/i.exec(notes);
    if (!m || !m[1]) return null;
    var parts = m[1].match(/[^,()]+(?:\([^)]*\))?/g) || [];
    var items = parts.map(function(p){ return p.trim(); }).filter(Boolean);
    if (!items.length) return null;
    return items.map(function(item){
      var dm = /^(.*?)\s*\(([^)]*)\)\s*$/.exec(item);
      var main = (dm ? dm[1] : item).trim();
      var detail = dm ? dm[2].trim() : "";
      if (/^RR\d{4}[A-Za-z]+$/.test(main)){
        return {isEvent:true, id:main, name:main, detail:detail};
      }
      var w = (div && div.wrestlers || []).find(function(x){ return x.name.toLowerCase() === main.toLowerCase(); });
      return {isEvent:false, id: w ? w.id : null, name: main, detail: detail};
    });
  }
  function ageAt(dobStr, atDateStr){
    if (!dobStr) return null;
    var d = new Date(dobStr), ref = atDateStr ? new Date(atDateStr) : new Date();
    if (isNaN(d.getTime()) || isNaN(ref.getTime())) return null;
    var yrs = ref.getFullYear() - d.getFullYear();
    var m = ref.getMonth() - d.getMonth();
    if (m < 0 || (m===0 && ref.getDate() < d.getDate())) yrs--;
    return yrs;
  }

  // ---------------- routing ----------------
  // Two-track scheme: "/", "/home" -> the combined landing page. Everything
  // else is "/<divisionKey>/<page>[/<arg>]", e.g. "/mens/events/RR2018M",
  // "/womens/wrestlers/beth-phoenix". A division key that doesn't match a
  // division actually present in the data (e.g. a stale link) falls back to
  // Home in render() below, rather than erroring.
  function parseHash(){
    var h = (location.hash || "#/home").replace(/^#\/?/, "");
    var parts = h.split("/").filter(Boolean);
    if (!parts.length || parts[0] === "home") return {division:null, page:"home", arg:null};
    if (parts[0] === "explore") return {division:null, page:"explore", arg: parts[1] ? decodeURIComponent(parts[1]) : null};
    if (parts[0] === "map") return {division:null, page:"map", arg:null};
    if (parts[0] === "titles") return {division:null, page:"titles", arg: parts[1] ? decodeURIComponent(parts[1]) : null};
    return {division: parts[0], page: parts[1] || "events", arg: parts[2] || null};
  }
  window.addEventListener("hashchange", render);

  function navigate(path){ location.hash = path; }

  // ---------------- render: shell nav ----------------
  function renderNav(route){
    var navlinks = document.getElementById("navlinks");
    var tabs = document.getElementById("tabs");
    navlinks.innerHTML = ""; tabs.innerHTML = "";

    function mk(label, path, isActive){
      return el("div", {class:"navlink"+(isActive?" active":""), text:label, onclick:function(){ navigate(path); }});
    }

    var homeActive = route.page === "home" || (!route.division && route.page !== "explore" && route.page !== "map" && route.page !== "titles");
    navlinks.appendChild(mk("Home", "/home", homeActive));
    tabs.appendChild(mk("Home", "/home", homeActive));

    var exploreActive = route.page === "explore";
    navlinks.appendChild(mk("Explore", "/explore", exploreActive));
    tabs.appendChild(mk("Explore", "/explore", exploreActive));

    var mapActive = route.page === "map";
    navlinks.appendChild(mk("World Map", "/map", mapActive));
    tabs.appendChild(mk("World Map", "/map", mapActive));

    var titlesActive = route.page === "titles";
    navlinks.appendChild(mk("Title Histories", "/titles", titlesActive));
    tabs.appendChild(mk("Title Histories", "/titles", titlesActive));

    (DB && DB.divisions || []).forEach(function(d){
      navlinks.appendChild(el("div", {class:"navsection", text:d.label}));
      [["events","Events"],["records","Records & Leaderboards"],["wrestlers","Wrestlers"],["entry-numbers","Entry Number Stats"],["locations","Host Locations"],["commentators","Commentators"]].forEach(function(pair){
        var isActive = route.division === d.key && route.page === pair[0];
        var path = "/"+d.key+"/"+pair[0];
        navlinks.appendChild(mk(pair[1], path, isActive));
        tabs.appendChild(mk(d.label.replace(" Royal Rumble","")+" "+pair[1], path, isActive));
      });
    });

    var meta = document.getElementById("navmeta");
    if (DB){
      meta.innerHTML =
        "<div>"+DB.meta.wrestlers+" wrestlers · "+DB.meta.events+" events</div>"+
        "<div>"+DB.meta.entrants+" entrants · "+DB.meta.eliminations+" eliminations</div>"+
        "<div>"+DB.meta.flagsOpen+" open / "+DB.meta.flagsResolved+" resolved data flags</div>";
    }
  }

  // ---------------- page: explore (cross-division topic search) ----------------
  // Searches DB.topics -- a flat, pre-built index (see
  // scripts/build_dashboard_data.py's "TOPIC EXPLORER" section) covering
  // records, notable moments, elimination narrative text, event-level
  // trivia, and a per-entry-number highlight card. Client-side substring
  // match only, no server -- the whole index is already in DB.topics.
  function numberProfileCard(div, np){
    if (!np) return null;
    var card = el("div", {class:"panel", style:"margin-bottom:14px;"});
    card.appendChild(el("h3", {text:"Entry #"+np.entryNumber+" — "+div.label}));
    var facts = el("div", {class:"factrow"});
    function fact(l,v){ if (v===null||v===undefined||v==="") return; facts.appendChild(el("div",{class:"fact"},[el("div",{class:"l",text:l}), el("div",{class:"v",text:v})])); }
    fact("Appearances", fmtNum(np.appearances));
    fact("Wins", np.wins+(np.appearances?(" ("+((np.wins/np.appearances)*100).toFixed(1)+"%)"):""));
    fact("Final Four finishes", fmtNum(np.finalFourCount));
    card.appendChild(facts);
    if (np.winners && np.winners.length){
      var wwrap = el("div", {class:"sub", style:"margin-top:10px;"}, [document.createTextNode("Winners from #"+np.entryNumber+": ")]);
      np.winners.forEach(function(w, idx){
        if (idx) wwrap.appendChild(document.createTextNode(", "));
        wwrap.appendChild(wlink({id:w.id, name:w.name}, null, div.key));
        wwrap.appendChild(document.createTextNode(" ("+w.year+")"));
      });
      card.appendChild(wwrap);
    }
    if (np.longestSurvival){
      var ls = np.longestSurvival;
      card.appendChild(el("div",{class:"sub", style:"margin-top:6px;"}, [
        document.createTextNode("Longest survival from #"+np.entryNumber+": "),
        wlink({id:ls.id, name:ls.name}, null, div.key),
        document.createTextNode(" — "+fmtSec(ls.sec)+" ("+ls.year+")")
      ]));
    }
    if (np.mostEliminations){
      var me = np.mostEliminations;
      card.appendChild(el("div",{class:"sub", style:"margin-top:6px;"}, [
        document.createTextNode("Most eliminations made from #"+np.entryNumber+": "),
        wlink({id:me.id, name:me.name}, null, div.key),
        document.createTextNode(" — "+me.count+" ("+me.year+")")
      ]));
    }
    return card;
  }

  function pageExplore(initialQuery){
    var c = el("div", {class:"container"});
    c.appendChild(el("div", {class:"page-head"}, [
      el("div", {class:"eyebrow", text:"Both divisions"}),
      el("h2", {text:"Explore"}),
      el("p", {text:"Search across every tracked record, notable moment, elimination description and entry-number highlight in the database — try a number (1–40), a wrestler's name, or a keyword like “chair”. Coverage note: hometown search only finds what's already recorded (a small share of entrants today — this grows automatically as biography research continues), and there's no tag yet for things like masked gimmicks, so those searches will come up empty until that data exists."})
    ]));

    var searchWrap = el("div", {style:"margin-bottom:10px;"});
    var search = el("input", {class:"search", type:"text", style:"max-width:480px;", placeholder:"Try “23”, “chair”, “Shawn Michaels”…"});
    search.value = initialQuery || "";
    searchWrap.appendChild(search);
    c.appendChild(searchWrap);

    var chipsWrap = el("div", {style:"margin-bottom:18px; display:flex; gap:6px; flex-wrap:wrap;"});
    ["23","chair","masked","Boston","40","Shawn Michaels"].forEach(function(ex){
      chipsWrap.appendChild(el("span", {class:"chip", style:"cursor:pointer;", text:ex, onclick:function(){ search.value = ex; draw(ex); }}));
    });
    c.appendChild(chipsWrap);

    var results = el("div", {id:"explore-results"});
    c.appendChild(results);

    var TYPE_LABELS = {trivia:"Trivia", record:"Records", moment:"Notable Moments", elimination:"Eliminations mentioning this"};

    function draw(qraw){
      var q = (qraw||"").trim();
      results.innerHTML = "";
      if (!q){
        results.appendChild(el("div",{class:"sub", text:"Start typing to search, or pick an example above."}));
        return;
      }
      var ql = q.toLowerCase();
      var anyResult = false;

      if (/^\d{1,3}$/.test(q)){
        var n = String(parseInt(q,10));
        (DB.divisions||[]).forEach(function(d){
          var np = DB.topics.numberProfiles[d.key] && DB.topics.numberProfiles[d.key][n];
          if (np){ anyResult = true; results.appendChild(numberProfileCard(d, np)); }
        });
        if (!anyResult) results.appendChild(el("div",{class:"sub", text:"No entrant has ever drawn #"+n+" in either division."}));
      }

      var wMatches = (DB.topics.wrestlerIndex||[]).filter(function(w){
        var hay = (w.name+" "+(w.aliases||[]).join(" ")+" "+(w.birthplace||"")+" "+(w.nationality||"")+" "+(w.ethnicity||"")+" "+(w.profileTerms||[]).join(" ")).toLowerCase();
        return hay.indexOf(ql) !== -1;
      });
      if (wMatches.length){
        anyResult = true;
        results.appendChild(el("div",{class:"cat-heading", text:"Wrestlers ("+wMatches.length+")"}));
        var wgrid = el("div", {class:"grid", style:"grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); margin-bottom:10px;"});
        wMatches.slice(0,24).forEach(function(w){
          var wdiv = getDivision(w.div);
          var card = el("div", {class:"card", onclick:(function(divKey,wid){return function(){navigate("/"+divKey+"/wrestlers/"+wid);};})(w.div,w.id)});
          card.appendChild(el("div",{style:"font-weight:600;", text:w.name}));
          card.appendChild(el("div",{class:"sub", text:(wdiv?wdiv.label.replace(" Royal Rumble",""):"")+(w.birthplace?(" · "+w.birthplace):"")+(w.ethnicity?(" · "+w.ethnicity):"")}));
          wgrid.appendChild(card);
        });
        results.appendChild(wgrid);
        if (wMatches.length > 24) results.appendChild(el("div",{class:"sub", style:"margin-bottom:10px;", text:"+"+(wMatches.length-24)+" more wrestlers match — refine your search."}));
      }

      var byType = {};
      (DB.topics.facts||[]).forEach(function(fct){
        var hay = (fct.title+" "+fct.text+" "+(fct.tags||[]).join(" ")).toLowerCase();
        if (hay.indexOf(ql) === -1) return;
        (byType[fct.type] = byType[fct.type]||[]).push(fct);
      });
      ["trivia","record","moment","elimination"].forEach(function(ty){
        var list = byType[ty];
        if (!list || !list.length) return;
        anyResult = true;
        results.appendChild(el("div",{class:"cat-heading", text:TYPE_LABELS[ty]+" ("+list.length+")"}));
        list.slice(0,30).forEach(function(fct){
          var pageSeg = fct.link && fct.link.page === "event" ? "events" : "wrestlers";
          var row = el("div", {class:"moment-row", style: fct.link ? "cursor:pointer;" : "",
            onclick: fct.link ? (function(divKey,seg,id){return function(){navigate("/"+divKey+"/"+seg+"/"+id);};})(fct.link.div, pageSeg, fct.link.id) : null});
          row.appendChild(el("div",{class:"moment-title", text:fct.title}));
          if (fct.text) row.appendChild(el("div",{class:"moment-desc", text:fct.text}));
          results.appendChild(row);
        });
        if (list.length > 30) results.appendChild(el("div",{class:"sub", style:"margin-top:6px;", text:"+"+(list.length-30)+" more — refine your search."}));
      });

      if (!anyResult){
        results.appendChild(el("div",{class:"sub", text:"No matches for “"+q+"” yet. Try a different spelling, an entry number, or a wrestler's name."}));
      }
    }

    search.addEventListener("input", function(){ draw(search.value); });
    if (initialQuery) draw(initialQuery);
    else results.appendChild(el("div",{class:"sub", text:"Start typing to search, or pick an example above."}));
    return c;
  }

  // ---------------- page: home (combined landing page) ----------------
  function pageHome(){
    var c = el("div", {class:"container"});
    c.appendChild(el("div", {class:"page-head"}, [
      el("div", {class:"eyebrow", text:"Est. 1988"}),
      el("h2", {text:"The Royal Rumble Database"}),
      el("p", {text:"Every Royal Rumble match, rebuilt to a reference-database standard: every eliminator credit, entry number and record is sourced, cross-checked against at least two independent accounts where possible, and tagged for how solid it is — confirmed, probable, or an open conflict — rather than smoothed over. The Men's and Women's Royal Rumble are tracked as two fully separate divisions below, each with its own Events, Records and Wrestlers — nothing here is blended into one combined stat line."})
    ]));

    var kpi = el("div", {class:"kpi-row"});
    [["events","Events built"],["wrestlers","Wrestlers"],["entrants","Entrants"],
     ["eliminations","Eliminations"],["records","Tracked records"]].forEach(function(pair){
      kpi.appendChild(el("div",{class:"kpi"},[
        el("div",{class:"v",text:fmtNum(DB.meta[pair[0]])}),
        el("div",{class:"l",text:pair[1]})
      ]));
    });
    c.appendChild(kpi);

    c.appendChild(el("div",{class:"cat-heading section-gap", text:"Choose a division"}));
    var grid = el("div", {class:"grid", style:"grid-template-columns:repeat(auto-fit,minmax(280px,1fr));"});
    (DB.divisions||[]).forEach(function(d){
      var years = d._minYear ? (d._minYear===d._maxYear ? (""+d._minYear) : (d._minYear+"–"+d._maxYear)) : "";
      grid.appendChild(el("div",{class:"card div-card", onclick:function(){navigate("/"+d.key+"/events");}},[
        el("div",{class:"eyebrow", text:years}),
        el("h3",{text:d.label}),
        el("div",{class:"ev-card wn", text:d.events.length+" event"+(d.events.length!==1?"s":"")+" · "+d.wrestlers.length+" wrestler entries · "+d.records.length+" tracked records"})
      ]));
    });
    c.appendChild(grid);

    c.appendChild(el("div",{class:"footnote", text:"Data quality is tracked, not assumed: every eliminator credit, event fact and career total in this database carries a CONFIRMED / PROBABLE / CONFLICTING status behind the scenes, and genuine disagreements between sources are preserved as flags rather than silently resolved. "+DB.meta.flagsOpen+" of those flags are still open. Men's and Women's Royal Rumble stats are kept completely separate throughout this dashboard; a wrestler who has competed in both (e.g. Beth Phoenix) keeps one profile identity but two fully independent stat lines, cross-linked from each division's wrestler page."}));

    return c;
  }

    var LAYERS = {
      "billed-cities": {
        desc:"Where Royal Rumble entrants were announced as being from at the time of each appearance. This is deliberately separate from birthplace: billed locations are part of the on-screen character and can change between events. Exact researched strings are grouped without guessing coordinates for unmatched or fictional places.",
        rows: wm.billedLocations || [],

        rowTitle: function(r){ return r.location; },
        rowAria: function(r){ return r.location+", "+r.count+" wrestlers across "+r.appearanceCount+" appearances"; },
        minR:3, maxR:16,
        ariaLabel:"World map of Royal Rumble billed-from locations",
        kpis: [

      },

        rows: wm.cities,

        rowTitle: function(r){ return r.city+", "+r.country; },

          [fmtNum(wm.totalCitiesPlotted), "Cities plotted"]
        ],
        showLabels: false,
        tableTitle:"By city",
        tableSub:"Same data as the map above. Click a city to see its full roster.",
        tooltipTitle: function(r){ return r.city+", "+r.country+" — "+r.count+(r.count===1?" wrestler":" wrestlers"); },
        tooltipSub: function(){ return null; },

        unmappedLabel: function(u){ return (u.birthplace||u.city||"")+" ("+u.count+")"; },

      },
      "billed-countries": {

        minR:4,maxR:25,ariaLabel:"World map of countries represented by Royal Rumble billed-from locations",
        kpis:[[fmtNum(wm.totalBilledAppearances),"Appearances with a billed-from location"],[fmtNum((wm.billedCountries||[]).reduce(function(n,r){return n+r.count;},0)),"Wrestler-country combinations plotted"],[fmtNum((wm.billedCountries||[]).length),"Countries plotted"]],
        showLabels:true,tableTitle:"By billed-from country",tableSub:"Click a country to open its complete wrestler roster.",

        roster:cityRoster,unmapped:[],unmappedLabel:function(){return "";},unmappedNote:""
      },

        desc:"Countries represented by wrestlers' recorded birthplaces. Switch to Cities for the precise birthplace pins, or to Billed From for the locations used by their on-screen characters.",
        rows: wm.birthplaceCountries || [],
        rowKey:function(r,idx){return slugifyCountry(r.country)+"-"+idx;},
        rowTitle:function(r){return r.country;},
        rowAria:function(r){return r.country+", "+r.count+" wrestlers";},
        minR:4,maxR:25,ariaLabel:"World map of wrestler birthplace countries",
        kpis:[[fmtNum(wm.totalWithBirthplace)+" / "+fmtNum(wm.totalWrestlers),"Wrestlers with a recorded birthplace"],[wm.birthplaceCoveragePct+"%","Coverage of the full roster"],[fmtNum((wm.birthplaceCountries||[]).length),"Countries plotted"]],
        showLabels:true,tableTitle:"By birthplace country",tableSub:"Click a country to open its complete wrestler roster.",

    var sourceKind="billed", levelKind="countries";
    function drawLayer(kind){
      var cfg = LAYERS[kind];
      btnBilled.classList.toggle("active", sourceKind==="billed");
      btnBirthplace.classList.toggle("active", sourceKind==="birthplace");
      btnCountries.classList.toggle("active", levelKind==="countries");
      btnCities.classList.toggle("active", levelKind==="cities");
      headP.textContent = cfg.desc;
      dynamicArea.innerHTML = "";

      var kpi = el("div", {class:"kpi-row"});
      cfg.kpis.forEach(function(pair){
        kpi.appendChild(el("div",{class:"kpi"},[
          el("div",{class:"v",text:pair[0]}),
          el("div",{class:"l",text:pair[1]})
        ]));
      });
      dynamicArea.appendChild(kpi);

      var rows = cfg.rows || [];
      // ---- shared roster-row registry, built before the map so a marker
      // click can open + scroll to the matching table row below it ----
      var rowRefs = {}; // row key -> {rowEl, listEl, open:bool, filled:bool, data}

      function setOpen(key, open){
        var ref = rowRefs[key];
        if (!ref) return;
        ref.open = open;
        ref.rowEl.classList.toggle("open", open);
        if (open && !ref.filled){
          ref.listEl.appendChild(cfg.roster(ref.data));
          ref.filled = true;
        }
      }

      var maxCount = rows.length ? Math.max.apply(null, rows.map(function(r){return r.count;})) : 1;

      var tablePanel = el("div", {class:"panel section-gap worldmap-table"});
      tablePanel.appendChild(el("h3", {text:cfg.tableTitle}));
      tablePanel.appendChild(el("div", {class:"sub", text:cfg.tableSub}));
      var rowsWrap = el("div");
      if (levelKind === "cities"){
        var tableSearch = el("input", {class:"search", type:"text", style:"margin:12px 0 4px;", placeholder:"Filter "+rows.length+" locations by name or country…"});
        tablePanel.appendChild(tableSearch);
        tableSearch.addEventListener("input", function(){
          var f = tableSearch.value.trim().toLowerCase();
          rows.forEach(function(r, idx){
            var ref = rowRefs[cfg.rowKey(r, idx)];
            if (!ref) return;
            ref.rowEl.style.display = (!f || cfg.rowTitle(r).toLowerCase().indexOf(f) !== -1) ? "" : "none";
          });
        });
      }
      tablePanel.appendChild(rowsWrap);
      rows.forEach(function(r, idx){
        var key = cfg.rowKey(r, idx);
        var rowEl = el("div", {class:"country-row", id:"loc-"+key});
        var bar = barRow(cfg.rowTitle(r), r.count, maxCount, false, function(v){ return v+(v===1?" wrestler":" wrestlers"); });
        var listEl = el("div", {});
        bar.addEventListener("click", function(){ activate(key); });
        rowEl.appendChild(bar);
        rowEl.appendChild(listEl);
        rowsWrap.appendChild(rowEl);
        rowRefs[key] = {rowEl:rowEl, listEl:listEl, open:false, filled:false, data:r};
      });

      // ---- map ----
      var panel = el("div", {class:"worldmap-panel"});
      panel.appendChild(el("div",{class:"map-help",text:"Scroll to zoom · drag to move · select any marker to open its full roster"}));
      var svgns = "http://www.w3.org/2000/svg";
      var svg = document.createElementNS(svgns, "svg");
      svg.setAttribute("viewBox", "0 0 "+wm.mapWidth+" "+wm.mapHeight);
      svg.setAttribute("class", "worldmap-svg");
      svg.setAttribute("role", "img");
      svg.setAttribute("aria-label", cfg.ariaLabel);

      // graticule (subtle lat/long grid, every 30 degrees) for map-like depth
      var gratG = document.createElementNS(svgns, "g");
      for (var lon=-150; lon<180; lon+=30){
        var gx = (lon+180) * (wm.mapWidth/360);
        var vline = document.createElementNS(svgns, "line");
        vline.setAttribute("x1", gx); vline.setAttribute("x2", gx);
        vline.setAttribute("y1", 0); vline.setAttribute("y2", wm.mapHeight);
        vline.setAttribute("class", "worldmap-grat");
        gratG.appendChild(vline);
      }
      for (var lat=-60; lat<=60; lat+=30){
        var gy = (90-lat) * (wm.mapHeight/180);
        var hline = document.createElementNS(svgns, "line");
        hline.setAttribute("x1", 0); hline.setAttribute("x2", wm.mapWidth);
        hline.setAttribute("y1", gy); hline.setAttribute("y2", gy);
        hline.setAttribute("class", "worldmap-grat");
        gratG.appendChild(hline);
      }
      svg.appendChild(gratG);

      var landG = document.createElementNS(svgns, "g");
      WORLD_LAND.forEach(function(land){
        var p = document.createElementNS(svgns, "path");
        p.setAttribute("d", land.d);
        p.setAttribute("class", "worldmap-land");
        landG.appendChild(p);
      });
      svg.appendChild(landG);

      var tooltip = el("div", {class:"worldmap-tooltip"});
      panel.appendChild(tooltip);
      var rosterDrawer=el("div",{class:"map-roster-drawer"});

      var minR = cfg.minR, maxR = cfg.maxR;
      function radiusFor(count){
        if (maxCount <= 1) return minR;
        return minR + (maxR - minR) * Math.sqrt(count / maxCount);
      }

      function activate(key){
        Object.keys(rowRefs).forEach(function(k){ if (k!==key) setOpen(k, false); });
        Object.keys(markerEls).forEach(function(k){ markerEls[k].classList.toggle("selected", k===key); });
        setOpen(key, true);
        var ref = rowRefs[key];
        if (ref){
          rosterDrawer.innerHTML="";
          rosterDrawer.classList.add("open");
          rosterDrawer.appendChild(el("div",{class:"map-roster-head"},[
            el("h3",{text:cfg.rowTitle(ref.data)}),
            el("span",{class:"chip",text:ref.data.count+(ref.data.count===1?" wrestler":" wrestlers")})
          ]));
          rosterDrawer.appendChild(cfg.roster(ref.data));
          var embedded=rosterDrawer.querySelector(".country-roster"); if(embedded)embedded.style.display="block";
        }
      }

      var markersG = document.createElementNS(svgns, "g");
      var markerEls = {}; // row key -> circle element, for selected-state styling
      rows.forEach(function(r, idx){
        var key = cfg.rowKey(r, idx);
        var rad = radiusFor(r.count);
        var g = document.createElementNS(svgns, "g");

        var circle = document.createElementNS(svgns, "circle");
        circle.setAttribute("cx", r.x);
        circle.setAttribute("cy", r.y);
        circle.setAttribute("r", rad);
        circle.setAttribute("class", "worldmap-marker"+(levelKind!=="countries"?" city-marker":""));
        circle.setAttribute("tabindex", "0");
        circle.setAttribute("role", "button");
        circle.setAttribute("aria-label", cfg.rowAria(r));
        markerEls[key] = circle;

        var sheen = document.createElementNS(svgns, "circle");
        sheen.setAttribute("cx", r.x - rad*0.32);
        sheen.setAttribute("cy", r.y - rad*0.32);
        sheen.setAttribute("r", Math.max(rad*0.34, 1));
        sheen.setAttribute("class", "worldmap-marker-sheen");

        function showTip(){
          var names = r.wrestlers.slice(0,8).map(function(w){return w.name;});
          var extra = r.count > 8 ? " +"+(r.count-8)+" more" : "";
          var subLine = cfg.tooltipSub(r);
          tooltip.innerHTML = "";
          tooltip.appendChild(el("div", {class:"t-name", text:cfg.tooltipTitle(r)}));
          if (subLine) tooltip.appendChild(el("div", {class:"t-sub", text:subLine}));
          tooltip.appendChild(el("div", {class:"t-sub", style:"margin-top:4px; color:var(--ink-2);", text:names.join(", ")+extra}));
          tooltip.appendChild(el("div", {class:"t-hint", text:"Click to open the full roster"}));
          tooltip.style.display = "block";
          var panelRect = panel.getBoundingClientRect();
          var px = (r.x / wm.mapWidth) * panelRect.width;
          var py = (r.y / wm.mapHeight) * (panelRect.width * wm.mapHeight / wm.mapWidth);
          var left = Math.min(Math.max(px + 14, 4), panelRect.width - 246);
          tooltip.style.left = left + "px";
          tooltip.style.top = Math.max(py - 10, 4) + "px";
        }
        function hideTip(){ tooltip.style.display = "none"; }
        // Overlapping/adjacent markers (common on the dense Cities layer)
        // still need to be individually clickable -- re-appending the
        // hovered marker's <g> moves it to the end of markersG, i.e. to the
        // front of SVG paint order, so it's the one that catches the
        // pointer even where several small circles sit on top of each other.
        function bringToFront(){ if (g.parentNode) g.parentNode.appendChild(g); }
        circle.addEventListener("mouseenter", function(){ bringToFront(); showTip(); });
        circle.addEventListener("mousemove", showTip);
        circle.addEventListener("mouseleave", hideTip);
        circle.addEventListener("focus", showTip);
        circle.addEventListener("blur", hideTip);
        circle.addEventListener("click", function(){ activate(key); });
        circle.addEventListener("keydown", function(ev){ if (ev.key==="Enter" || ev.key===" "){ ev.preventDefault(); activate(key); } });

        g.appendChild(circle);
        g.appendChild(sheen);
        markersG.appendChild(g);
      });
      svg.appendChild(markersG);

      // direct labels for the top handful of markers, spread across
      // continents rather than the crowded Europe cluster -- readable at a
      // glance without needing to hover every dot. Skipped on the Cities
      // layer, where 331 closely-packed pins would just turn into overlapping text.
      if (cfg.showLabels){
        var labelG = document.createElementNS(svgns, "g");
        var labeled = {};
        rows.slice(0, 12).forEach(function(r, idx){
          if (Object.keys(labeled).length >= 6) return;
          var tooClose = Object.keys(labeled).some(function(k){
            var o = labeled[k];
            return Math.hypot(o.x-r.x, o.y-r.y) < 70;
          });
          if (tooClose) return;
          labeled[cfg.rowKey(r, idx)] = r;
          var rad = radiusFor(r.count);
          var onRightEdge = r.x > wm.mapWidth - 90;
          var label = document.createElementNS(svgns, "text");
          label.setAttribute("x", onRightEdge ? r.x - rad - 6 : r.x + rad + 6);
          label.setAttribute("y", r.y + 4);
          label.setAttribute("text-anchor", onRightEdge ? "end" : "start");
          label.setAttribute("class", "worldmap-label");
          label.textContent = cfg.rowTitle(r);
          labelG.appendChild(label);
        });
        svg.appendChild(labelG);
      }

      // size legend, bottom-left
      var legendG = document.createElementNS(svgns, "g");
      var legendVals = [Math.max(1, Math.round(maxCount*0.15)), Math.max(2, Math.round(maxCount*0.5)), maxCount];
      var legendX = 14, legendBaseY = wm.mapHeight - 16;
      legendG.appendChild((function(){
        var t = document.createElementNS(svgns, "text");
        t.setAttribute("x", legendX); t.setAttribute("y", legendBaseY - maxR*2 - 8);
        t.setAttribute("class", "worldmap-legend-text");
        t.textContent = "Wrestlers";
        return t;
      })());
      var cursorX = legendX + 6;
      legendVals.forEach(function(v){
        var r = radiusFor(v);
        var cy = legendBaseY - r;
        var dot = document.createElementNS(svgns, "circle");
        dot.setAttribute("cx", cursorX + r); dot.setAttribute("cy", cy); dot.setAttribute("r", r);
        dot.setAttribute("class", "worldmap-legend-dot");
        legendG.appendChild(dot);
        var lbl = document.createElementNS(svgns, "text");
        lbl.setAttribute("x", cursorX + r); lbl.setAttribute("y", legendBaseY + 12);
        lbl.setAttribute("text-anchor", "middle");
        lbl.setAttribute("class", "worldmap-legend-text");
        lbl.textContent = String(v);
        legendG.appendChild(lbl);
        cursorX += r*2 + 14;
      });
      svg.appendChild(legendG);

      panel.appendChild(svg);
      var zoom={x:0,y:0,w:wm.mapWidth,h:wm.mapHeight}, dragging=false, start=null;
      function applyView(){svg.setAttribute("viewBox",zoom.x+" "+zoom.y+" "+zoom.w+" "+zoom.h);}
      function zoomAt(factor,cx,cy){
        var nw=Math.max(wm.mapWidth/8,Math.min(wm.mapWidth,zoom.w*factor));
        var nh=nw*wm.mapHeight/wm.mapWidth;
        var px=(cx===undefined?0.5:cx),py=(cy===undefined?0.5:cy);
        zoom.x=Math.max(0,Math.min(wm.mapWidth-nw,zoom.x+(zoom.w-nw)*px));
        zoom.y=Math.max(0,Math.min(wm.mapHeight-nh,zoom.y+(zoom.h-nh)*py));

      }
      svg.addEventListener("wheel",function(ev){ev.preventDefault();var r=svg.getBoundingClientRect();zoomAt(ev.deltaY>0?1.22:.82,(ev.clientX-r.left)/r.width,(ev.clientY-r.top)/r.height);},{passive:false});
      svg.addEventListener("pointerdown",function(ev){dragging=true;start={x:ev.clientX,y:ev.clientY,vx:zoom.x,vy:zoom.y};svg.classList.add("dragging");svg.setPointerCapture(ev.pointerId);});
      svg.addEventListener("pointermove",function(ev){if(!dragging)return;var r=svg.getBoundingClientRect();zoom.x=Math.max(0,Math.min(wm.mapWidth-zoom.w,start.vx-(ev.clientX-start.x)*zoom.w/r.width));zoom.y=Math.max(0,Math.min(wm.mapHeight-zoom.h,start.vy-(ev.clientY-start.y)*zoom.h/r.height));applyView();});
      svg.addEventListener("pointerup",function(){dragging=false;svg.classList.remove("dragging");});
      var controls=el("div",{class:"worldmap-controls"},[
        el("button",{type:"button",text:"+",title:"Zoom in",onclick:function(){zoomAt(.75);}}),
        el("button",{type:"button",text:"−",title:"Zoom out",onclick:function(){zoomAt(1.3);}}),
        el("button",{type:"button",text:"Reset",title:"Reset map",onclick:function(){zoom={x:0,y:0,w:wm.mapWidth,h:wm.mapHeight};applyView();}})
      ]);
      panel.appendChild(controls);
      panel.appendChild(rosterDrawer);
      dynamicArea.appendChild(panel);
      dynamicArea.appendChild(tablePanel);

      if (cfg.unmapped && cfg.unmapped.length){
        var unmappedPanel = el("div", {class:"panel section-gap"});
        unmappedPanel.appendChild(el("h3", {text:"Not yet plotted"}));
        unmappedPanel.appendChild(el("div", {class:"sub", text:cfg.unmappedNote}));
        var chipWrap = el("div", {class:"badges", style:"margin-top:8px;"});
        cfg.unmapped.forEach(function(u){
          chipWrap.appendChild(el("span", {class:"chip", text:cfg.unmappedLabel(u)}));
        });
        unmappedPanel.appendChild(chipWrap);
        dynamicArea.appendChild(unmappedPanel);
      }
    }

    function redraw(){ drawLayer(sourceKind+"-"+levelKind); }
    btnBilled.addEventListener("click", function(){ sourceKind="billed"; redraw(); });
    btnBirthplace.addEventListener("click", function(){ sourceKind="birthplace"; redraw(); });
    btnCountries.addEventListener("click", function(){ levelKind="countries"; redraw(); });
    btnCities.addEventListener("click", function(){ levelKind="cities"; redraw(); });
    redraw();

    return c;
  }

  // ---------------- page: title histories ----------------
  // Browses DB.championshipHistory -- a promotion/championship/reign tree
  // built independently of the Rumble match data above (its own asOf/scope
  // snapshot, not a live dependency). Nothing else in the dashboard renders
  // this as a standalone view; the per-wrestler "Championship status at
  // entry" panel on a wrestler profile page is a different, narrower source
  // (what a wrestler held walking into a specific Rumble) and is untouched
  // by this page. wrestlerIds here are canonical ids that may belong to
  // either division (or neither, for a champion never in a Royal Rumble),
  // so every link uses anyDivWlink/findWrestlerAnyDiv rather than a wlink()
  // scoped to CUR_DIV -- there is no single division on this page.
  function pageTitles(initialArg){
    var c = el("div", {class:"container"});
    var ch = (DB && DB.championshipHistory) || {asOf:null, scope:null, promotions:[], championships:[], wrestlerSummary:{}};
    var promoById = {};
    ch.promotions.forEach(function(p){ promoById[p.id] = p; });

    c.appendChild(el("div", {class:"page-head"}, [
      el("div", {class:"eyebrow", text:ch.promotions.length+" promotions · "+ch.championships.length+" championships"}),
      el("h2", {text:"Title Histories"}),
      el("p", {text:"Every championship lineage tracked in this database, grouped by promotion, with its full reign-by-reign history. "+(ch.scope||"")+(ch.asOf?(" Snapshot as of "+ch.asOf+" — sourced independently of the Rumble match data elsewhere in this dashboard, and not kept live against it.") : "")})
    ]));

    var controls = el("div", {style:"display:flex; gap:10px; flex-wrap:wrap; margin-bottom:18px;"});
    var search = el("input", {class:"search", type:"text", style:"max-width:320px;", placeholder:"Search by champion, title or promotion…"});
    controls.appendChild(search);
    c.appendChild(controls);

    var listArea = el("div");
    c.appendChild(listArea);
    var detailArea = el("div", {class:"section-gap"});
    c.appendChild(detailArea);

    function championshipMatches(champ, q, promoId){
      if (promoId && champ.promotionId !== promoId) return false;
      if (!q) return true;
      var promo = promoById[champ.promotionId];
      var hay = (champ.name+" "+(promo?promo.name+" "+promo.abbreviation:"")).toLowerCase();
      if (hay.indexOf(q) !== -1) return true;
      return champ.reigns.some(function(r){ return (r.champion||"").toLowerCase().indexOf(q) !== -1; });
    }

    function extLink(url, label){
      return url ? el("a", {class:"wlink", href:url, target:"_blank", rel:"noopener noreferrer", text:label}) : null;
    }

    function reignTimeline(champ){
      var wrap = el("div", {class:"panel"});
      var promo = promoById[champ.promotionId];
      var backlink = el("div", {class:"backlink", text:"← Close", onclick:function(){ detailArea.innerHTML = ""; }});
      wrap.appendChild(backlink);
      wrap.appendChild(el("h3", {text:champ.name}));
      wrap.appendChild(el("div", {class:"sub", text:(promo?promo.name+" ("+promo.abbreviation+")":champ.promotionId)+" · "+champ.level+(champ.division && champ.division!=="Open" ? " · "+champ.division : "")+" · "+(champ.activeFrom||"?")+"–"+(champ.activeTo||"present")+" · "+champ.reigns.length+" reign"+(champ.reigns.length!==1?"s":"")+" tracked"}));
      var links = el("div", {style:"margin-top:8px; display:flex; gap:16px; font-size:12px;"});
      var l1 = extLink(champ.officialHistoryUrl, "Official history ↗"); if (l1) links.appendChild(l1);

        el("th",{text:"#"}), el("th",{text:"Champion"}), el("th",{text:"Won"}), el("th",{text:"Lost"}),
        el("th",{text:"Days"}), el("th",{text:"Event / Location"})
      ])]));
      var tbody = el("tbody");
      champ.reigns.forEach(function(r){

          champCell.appendChild(el("span",{class:"chip", style:"margin-left:5px;", text: r.type==="vacancy" ? "Vacant" : "Disputed lineage"}));
        }
        if (r.wrestlerIds && r.wrestlerIds.length){
          var chips = el("div", {class:"badges"});
          r.wrestlerIds.forEach(function(wid){
            var w = findWrestlerAnyDiv(wid);
            var chip = el("span",{class:"chip"});
            chip.appendChild(anyDivWlink(wid, w ? w.name : wid));
            chips.appendChild(chip);
          });
          champCell.appendChild(chips);
        }
        if (r.notes) champCell.appendChild(el("div",{class:"method-note", style:"max-width:44ch;", text:r.notes}));
        tbody.appendChild(el("tr",{},[
          el("td",{class:"num", text: r.reignNumber!==null && r.reignNumber!==undefined ? r.reignNumber : "—"}),
          champCell,

          el("td",{class:"num", text:r.daysReported||"—"}),
          el("td",{text:[r.event,r.location].filter(Boolean).join(" · ") || "—"})
        ]));
      });
      table.appendChild(tbody);

    }

    function showChampionship(champId){
      var champ = ch.championships.find(function(x){ return x.id === champId; });
      detailArea.innerHTML = "";
      if (!champ) return;
      detailArea.appendChild(reignTimeline(champ));
      detailArea.scrollIntoView({behavior:"smooth", block:"start"});
    }

    var selectedPromo=null;
    function prestige(champ){
      var order={"World":0,"Secondary":1,"Television":2,"Openweight":3,"X Division":3,"Tag team":4,"Trios":5,"Weight class":6,"Regional":7,"Specialty":8,"Developmental":9};
      return order[champ.level]===undefined?99:order[champ.level];
    }
    function promoCard(p){
      return el("div",{class:"promotion-card"+(selectedPromo===p.id?" selected":""),onclick:function(){selectedPromo=p.id;draw();}},[
        el("div",{class:"abbr",text:p.abbreviation||p.name}),
        el("div",{class:"pname",text:p.name}),
        el("div",{class:"method-note",text:ch.championships.filter(function(x){return x.promotionId===p.id;}).length+" titles tracked"})
      ]);
    }
    function drawTitles(pid,q){
      var promo=promoById[pid];
      var champs=ch.championships.filter(function(x){return x.promotionId===pid&&championshipMatches(x,q,pid);});
      if(!champs.length)return;
      listArea.appendChild(el("div",{class:"cat-heading section-gap",text:promo.name+" ("+promo.abbreviation+")"}));
      function brandOf(champ){
        if(pid!=="wwe")return promo.abbreviation||promo.name;
        if(/^NXT\b/i.test(champ.name))return "NXT";
        if(/^WWE Evolve\b/i.test(champ.name))return "WWE Evolve";
        if(/^WWE ID\b/i.test(champ.name))return "WWE ID";

      }
      function formatOf(champ){return champ.level==="Tag team"||champ.level==="Trios"?"Tag Team & Trios":"Singles";}

        var grid=el("div",{class:"grid records"});
        rows.sort(function(a,b){return prestige(a)-prestige(b)||a.name.localeCompare(b.name);}).forEach(function(champ){
          var lastReign=champ.reigns.filter(function(r){return r.type==="reign";}).slice(-1)[0];
          var card=el("div",{class:"card rec-card actionable",onclick:function(){showChampionship(champ.id);}});
          card.appendChild(el("div",{class:"cat",text:champ.level}));
          card.appendChild(el("div",{class:"nm",text:champ.name}));
          card.appendChild(el("div",{class:"val",text:champ.reigns.length+" reign"+(champ.reigns.length!==1?"s":"")}));
          if(lastReign)card.appendChild(el("div",{class:"holder",text:(lastReign.current?"Current: ":"Last: ")+lastReign.champion}));
          card.appendChild(el("div",{class:"note",text:"Open full reign timeline"})); grid.appendChild(card);
        });

        if(!rows.length)return;
        listArea.appendChild(el("h3",{style:"margin:16px 0 10px;",text:group[0]}));
        var brands=[]; rows.forEach(function(x){var b=brandOf(x);if(brands.indexOf(b)<0)brands.push(b);});
        brands.forEach(function(brand){
          if(brands.length>1)listArea.appendChild(el("div",{class:"cat-heading",style:"margin-top:14px;",text:brand}));
          ["Men's","Women's","Open"].forEach(function(gender){
            ["Singles","Tag Team & Trios"].forEach(function(format){
              var subset=rows.filter(function(x){return brandOf(x)===brand&&(x.division||"Open")===gender&&formatOf(x)===format;});
              if(!subset.length)return;
              listArea.appendChild(el("div",{class:"method-note",style:"margin:12px 0 7px; font-weight:800;",text:(gender==="Open"?"Open division":gender)+" · "+format}));
              renderTitleCards(subset);
            });
          });
        });
      });
    }
    function draw(){
      var q = search.value.trim().toLowerCase();
      listArea.innerHTML = "";
      var promos=ch.promotions.filter(function(p){return ch.championships.some(function(x){return championshipMatches(x,q,p.id);});});
      if(!promos.length){

        card.appendChild(el("div", {class:"val", text: r.eventsCount+" event"+(r.eventsCount!==1?"s":"")}));
        var holderDiv = el("div", {class:"holder"});
        holderDiv.appendChild(document.createTextNode("First: "));
        holderDiv.appendChild(eventLink(r.firstEvent));
        if (r.mostRecentEvent && r.mostRecentEvent.id !== r.firstEvent.id){
          holderDiv.appendChild(document.createTextNode(" · Most recent: "));
          holderDiv.appendChild(eventLink(r.mostRecentEvent));
        }
        card.appendChild(holderDiv);
        if (r.events && r.events.length > 2){
          var list = el("div", {class:"member-list"});
          r.events.forEach(function(ev){

          });

            open = !open;
